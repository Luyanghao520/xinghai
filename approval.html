<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>注册审批 · 星海工作端</title>
<style>
        :root{--navy:#F5F5F5;--blue:#89AACC;--gold:#89AACC;--gold-2:#C2D8EC;--ink:#F5F5F5;--sub:#8A8A8A;--line:#1F1F1F;--bg:#0A0A0A;--card:#141414;--ok:#7FD1A7;--warn:#E8C07A;--bad:#E08A8A;--red:#E08A8A;--accent-soft:#BCD4EA;--font-body:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;--font-display:'Instrument Serif','Noto Serif SC','Songti SC','STSong',serif;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--font-body);background:radial-gradient(110% 70% at 50% -10%,#10151C 0%,#0A0A0C 55%,#070708 100%);position:relative;color:var(--ink);line-height:1.6;overflow-x:hidden;}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(circle at 15% 20%,rgba(78,133,191,.10),transparent 42%),
               radial-gradient(circle at 85% 50%,rgba(137,170,204,.07),transparent 42%),
               radial-gradient(circle at 50% 85%,rgba(78,133,191,.06),transparent 40%);}

  /* ── 背景装饰光斑 ── */
  body::before{content:'';position:fixed;top:-160px;right:-80px;width:500px;height:500px;background:radial-gradient(circle at 30% 40%,rgba(137,170,204,.09),transparent 70%);border-radius:50%;pointer-events:none;z-index:0;animation:spot1 9s ease-in-out infinite;}
  body::after{content:'';position:fixed;bottom:-140px;left:-100px;width:440px;height:440px;background:radial-gradient(circle at 60% 50%,rgba(78,133,191,.10),transparent 70%);border-radius:50%;pointer-events:none;z-index:0;animation:spot2 11s ease-in-out infinite;}
  .spot{position:fixed;top:50%;left:50%;width:520px;height:520px;transform:translate(-50%,-50%);background:radial-gradient(circle at 50% 50%,rgba(137,170,204,.04),transparent 60%);border-radius:50%;pointer-events:none;z-index:0;}
  @keyframes spot1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(22px,-16px) scale(1.04);}}
  @keyframes spot2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-20px,14px) scale(1.05);}}

  /* ── 顶栏（玻璃态）── */
  header{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;padding:14px 24px;background:rgba(20,20,20,.85);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom:1px solid var(--line);}
  .brand{font-weight:800;font-size:16px;color:var(--navy);letter-spacing:1px;}
  .brand span{color:var(--gold);}
  .crumb{font-size:12.5px;color:var(--sub);}.crumb a{color:var(--blue);text-decoration:none;transition:color .2s;}.crumb a:hover{color:var(--navy);}
  .user{margin-left:auto;font-size:13px;color:var(--sub);}.user b{color:var(--navy);}.user a{margin-left:12px;color:var(--blue);text-decoration:none;font-weight:600;transition:color .2s;}.user a:hover{color:var(--navy);}
  /* 覆盖 HTML 内联浅描边（返回链接）为暗色药丸 */
  header>a[href="#"]{border-color:#2A2A2E!important;background:rgba(137,170,204,.05)!important;border-radius:999px!important;transition:border-color .2s,background .2s;}
  header>a[href="#"]:hover{border-color:#89AACC!important;color:#89AACC!important;}

  /* ── 主容器 ── */
  .wrap{max-width:1060px;margin:28px auto;padding:0 20px;position:relative;z-index:1;}
  .count{font-size:12.5px;color:var(--sub);margin-bottom:14px;font-weight:600;}

  /* ── 表格（圆角 + 斑马纹 + hover）── */
  .tablewrap{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.4);}
  .scroll{overflow-x:auto;}
  table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:680px;}
  th,td{border-bottom:1px solid var(--line);padding:11px 13px;text-align:left;vertical-align:middle;}
  th{background:var(--surface);color:var(--sub);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;position:sticky;top:0;z-index:2;}
  tbody tr:nth-child(even){background:rgba(255,255,255,.015);}
  tbody tr:hover{background:rgba(137,170,204,.05);transition:background .15s;}

  /* ── 状态标签 ── */
  .tag{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;letter-spacing:.3px;}
  .tag.wait{background:rgba(232,192,122,.08);color:var(--warn);border:1px solid rgba(232,192,122,.28);}
  .tag.ok{background:rgba(127,209,167,.08);color:var(--ok);border:1px solid rgba(127,209,167,.28);}
  .tag.no{background:rgba(224,138,138,.08);color:var(--red);border:1px solid rgba(224,138,138,.28);}

  /* ── 操作链接 ── */
  .op{color:var(--blue);cursor:pointer;text-decoration:none;margin-right:8px;font-weight:600;font-size:12px;padding:3px 8px;border-radius:6px;transition:all .2s;}
  .op:hover{background:rgba(137,170,204,.08);text-decoration:underline;}
  .op.no{color:var(--red);}.op.no:hover{background:rgba(220,74,61,.08);}
  .op.dis{color:#B0B8C5;cursor:default;text-decoration:none;}
  .op.dis:hover{background:transparent;text-decoration:none;}

  .empty{text-align:center;color:#B0B8C5;padding:42px;font-size:13px;}

  /* ── Toast ── */
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:rgba(26,26,28,.94);backdrop-filter:blur(12px);color:var(--ink);border:1px solid var(--stroke2,#2A2A2E);padding:12px 22px;border-radius:999px;font-size:13.5px;opacity:0;transition:.3s ease;z-index:90;pointer-events:none;box-shadow:0 0 24px rgba(137,170,204,.16);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media(max-width:640px){header{padding:12px 16px;gap:8px;}.wrap{margin:16px auto;padding:0 12px;}}

  *{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
  body{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);}
  button,a,.clickable{min-height:44px;}
  input,select,textarea{font-size:16px!important;}
  @media(max-width:480px){
    body{font-size:14px;line-height:1.6;}
    .wrap{padding:0 14px;}
    section{padding:40px 0;}
    .sec-head h2{font-size:21px;}
    .sec-head .kicker{font-size:10.5px;}
  }

  @media(max-width:480px){
    .stats-row{grid-template-columns:1fr 1fr!important;display:grid;gap:8px;}
    .stat-card{padding:12px 10px;min-width:0;}
    .stat-card .num{font-size:20px;}
    .stat-card .label{font-size:10.5px;}
    .grid{grid-template-columns:1fr!important;}
    .mod{padding:16px;}
    .mod .t{font-size:13px;}
    .mod .d{font-size:11.5px;}
    .ic-circle{width:38px;height:38px;font-size:16px;}
    .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    table{font-size:11px;min-width:600px;}
    th,td{padding:7px 8px;}
    header{padding:10px 14px;gap:8px;}
    .brand{font-size:14px;}
    .user{font-size:12px;}
    .hi{font-size:20px;}
    .badge{font-size:9.5px;padding:2px 8px;}
  }

</style>
<link rel="stylesheet" href="/static/css/theme.css">
</head>
<body>
<div class="spot"></div>
<header>
  <div class="brand">星海艺术团工作端</div>
  <a href="#" onclick="history.back();return false" style="color:var(--blue);font-size:12.5px;text-decoration:none;font-weight:600;padding:4px 10px;border-radius:8px;border:1.5px solid #DDE2EC">← 返回</a><div class="crumb"><a href="/work">总览</a> / 注册审批</div>
  <div class="user">你好，<b id="uname">—</b>（<span id="urole">—</span>） <a href="/logout">登出</a></div>
</header>
<div class="wrap">
  <div class="count" id="count">—</div>
  <div class="tablewrap"><div class="scroll">
    <table>
      <thead><tr><th>ID</th><th>学号</th><th>姓名</th><th>校区</th><th>状态</th><th>提交时间</th><th>操作</th></tr></thead>
      <tbody id="tbody"><tr><td colspan="7" class="empty">加载中…</td></tr></tbody>
    </table>
  </div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
fetch('/api/me').then(r=>r.json()).then(d=>{
  if(!d.ok){location.href='/login';return;}
  $('uname').textContent=d.name;$('urole').textContent=d.role;
  if(d.role!=='主席'&&d.role!=='副主席'){
    document.querySelector('.wrap').innerHTML='<div class="empty">仅主席 / 副主席可审批注册</div>';return;
  }
  load();
});
function statusTag(s){return s==='已通过'||s==='通过'?'<span class="tag ok">通过</span>':s==='已驳回'||s==='驳回'?'<span class="tag no">驳回</span>':'<span class="tag wait">待审</span>';}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function load(){
  fetch('/api/register').then(r=>r.json()).then(rows=>{
    if(rows.ok===false){document.querySelector('.wrap').innerHTML='<div class="empty">'+rows.error+'</div>';return;}
    $('count').textContent='共 '+rows.length+' 条';
    const tb=$('tbody');
    if(!rows.length){tb.innerHTML='<tr><td colspan="7" class="empty">暂无注册申请</td></tr>';return;}
    tb.innerHTML=rows.map(r=>{
      const ops = r.status==='待审'
        ? '<span class="op" onclick="act('+r.id+',\'approve\')">通过</span><span class="op no" onclick="act('+r.id+',\'reject\')">驳回</span>'
        : '<span class="op dis">—</span>';
      return '<tr><td>'+r.id+'</td><td>'+r.xh+'</td><td>'+r.name+'</td><td>'+(r.campus||'—')+
        '</td><td>'+statusTag(r.status)+'</td><td>'+(r.created||'—')+'</td><td>'+ops+'</td></tr>';
    }).join('');
  });
}
function act(id,st){
  if(!confirm(st==='approve'?'确认通过该注册申请？':'确认驳回该申请？'))return;
  fetch('/api/register/'+id+'/'+st,{method:'POST'}).then(r=>r.json()).then(res=>{
    if(res.ok){toast(st==='approve'?'已通过，账号已创建':'已驳回');load();}
    else toast(res.error||'操作失败');
  });
}
</script>
</body>
</html>
