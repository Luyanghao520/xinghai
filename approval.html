<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>注册审批 · 星海工作端</title>
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/ui.css">
<style>
  .empty{text-align:center;color:var(--xh-muted);padding:42px 20px;font-size:13px;}
  .op-dis{opacity:.35;cursor:default;}
</style>
<link rel="stylesheet" href="/static/css/bg.css">
<script src="/static/js/bg.js" defer></script>
</head>
<body>
<header class="xh-topbar">
  <a class="xh-topbar-brand" href="/work"><img src="/static/uploads/logo.png" alt="">星海<em>工作端</em></a>
  <a class="xh-btn xh-btn-ghost xh-btn-sm" href="#" onclick="history.back();return false">← 返回</a>
  <div class="xh-topbar-crumb"><a href="/work">总览</a> / 注册审批</div>
  <div class="xh-topbar-spacer"></div>
  <div class="xh-topbar-user">你好，<b id="uname">—</b><span class="xh-role" id="urole">—</span><a class="xh-btn-text" href="/logout">登出</a></div>
</header>

<main class="xh-page">
  <div class="xh-page-head xh-row">
    <div>
      <h1 class="xh-page-title">注册审批</h1>
      <div class="xh-page-sub">新成员注册申请审批，通过后自动创建账号</div>
    </div>
    <div class="xh-topbar-spacer"></div>
    <span class="xh-count xh-toolbar" id="count" style="margin:0">—</span>
  </div>

  <section class="xh-panel xh-panel-flush xh-section-gap">
    <div class="xh-tablewrap">
      <table>
        <thead><tr><th>ID</th><th>学号</th><th>姓名</th><th>校区</th><th>状态</th><th>提交时间</th><th>操作</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="7" class="empty">加载中…</td></tr></tbody>
      </table>
    </div>
  </section>
</main>

<script src="/static/js/vendor/lucide.min.js" defer></script>
<script src="/static/js/ui.js"></script>
<script>
const $=id=>document.getElementById(id);
fetch('/api/me').then(r=>r.json()).then(d=>{
  if(!d.ok){location.href='/login';return;}
  $('uname').textContent=d.name;$('urole').textContent=d.role;
  if(d.role!=='主席'&&d.role!=='副主席'){
    document.querySelector('.xh-page').innerHTML='<div class="xh-panel"><div class="empty">仅主席 / 副主席可审批注册</div></div>';return;
  }
  load();
});
function statusTag(s){return s==='已通过'||s==='通过'?'<span class="xh-badge ok">通过</span>':s==='已驳回'||s==='驳回'?'<span class="xh-badge bad">驳回</span>':'<span class="xh-badge warn">待审</span>';}
function toast(m){XH.toast(m);}
function load(){
  fetch('/api/register').then(r=>r.json()).then(rows=>{
    if(rows.ok===false){document.querySelector('.xh-page').innerHTML='<div class="xh-panel"><div class="empty">'+rows.error+'</div></div>';return;}
    $('count').textContent='共 '+rows.length+' 条';
    const tb=$('tbody');
    if(!rows.length){tb.innerHTML='<tr><td colspan="7" class="empty">暂无注册申请</td></tr>';return;}
    tb.innerHTML=rows.map(r=>{
      const ops = r.status==='待审'
        ? '<span class="xh-btn-text" onclick="act('+r.id+',\'approve\')">通过</span><span class="xh-btn-text xh-danger-text" onclick="act('+r.id+',\'reject\')">驳回</span>'
        : '<span class="xh-btn-text op-dis">—</span>';
      return '<tr><td class="xh-num">'+r.id+'</td><td class="xh-num">'+r.xh+'</td><td>'+r.name+'</td><td>'+(r.campus||'—')+
        '</td><td>'+statusTag(r.status)+'</td><td class="xh-num">'+(r.created||'—')+'</td><td style="white-space:nowrap">'+ops+'</td></tr>';
    }).join('');
  });
}
function act(id,st){
  if(!confirm(st==='approve'?'确认通过该注册申请？':'确认驳回该申请？'))return;
  fetch('/api/register/'+id+'/'+st,{method:'POST'}).then(r=>r.json()).then(res=>{
    if(res.ok){toast(st==='approve'?'已通过，账号已创建':'已驳回');load();}
    else toast(res.error||'操作失败');
  });
}
</script>
</body>
</html>
