<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>重置密码 · 星海工作端</title>
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/ui.css">
<link rel="stylesheet" href="/static/css/bg.css">
<style>
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  .reset-card{width:420px;max-width:94vw;padding:30px 28px 26px;}
  .reset-brand{text-align:center;margin-bottom:20px;}
  .reset-brand h1{
    margin:0;font-family:var(--xh-font-display);font-weight:600;
    font-size:22px;letter-spacing:.08em;color:var(--xh-text);
  }
  .reset-brand h1 em{
    font-style:normal;
    background-image:var(--xh-accent);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .reset-sub{font-size:12.5px;color:var(--xh-muted);margin-top:6px;line-height:1.7;}
  .reset-form{display:flex;flex-direction:column;gap:14px;}
  /* 密码可见切换 */
  .pwd-wrap{position:relative;}
  .pwd-wrap .xh-input{padding-right:44px;}
  .pwd-eye{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:32px;height:32px;border:none;border-radius:8px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    background:transparent;color:var(--xh-muted);transition:color var(--xh-t-fast),background var(--xh-t-fast);
  }
  .pwd-eye:hover{color:var(--xh-text);background:rgba(255,255,255,.06);}
  .pwd-eye svg{width:16px;height:16px;}
  .field-err{color:var(--xh-bad);font-size:11.5px;display:none;}
  .xh-invalid .field-err{display:block;}
  .reset-err{color:var(--xh-bad);font-size:12.5px;text-align:center;min-height:18px;line-height:1.5;}
  /* 会话终止提示（authentication-13 语义：改密结束所有设备会话） */
  .session-note{
    display:flex;gap:9px;align-items:flex-start;
    font-size:12px;color:var(--xh-warn);line-height:1.7;
    background:rgba(232,192,122,.07);border:1px solid rgba(232,192,122,.22);
    border-radius:10px;padding:10px 12px;
  }
  .session-note svg{width:14px;height:14px;flex:none;margin-top:3px;}
  .reset-links{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  @media (max-width:420px){
    body{align-items:flex-start;padding-top:6vh;}
    .reset-card{padding:24px 18px 20px;}
  }
</style>
<script src="/static/js/bg.js" defer></script>
</head>
<body>
  <main class="xh-panel reset-card">
    <div class="reset-brand">
      <h1>重置<em>密码</em></h1>
      <div class="reset-sub">验证旧密码后设置新密码；新密码须 ≥8 位且包含大小写字母与数字</div>
    </div>
    <form class="reset-form" onsubmit="return false">
      <div class="xh-field">
        <label for="xh">学号 / 工号</label>
        <input id="xh" class="xh-input" placeholder="如 251400143" autocomplete="off" inputmode="numeric">
      </div>
      <div class="xh-field" id="fOld">
        <label for="old_pwd">旧密码</label>
        <div class="pwd-wrap">
          <input id="old_pwd" class="xh-input" type="password" placeholder="当前使用的密码">
          <button type="button" class="pwd-eye" data-eye="old_pwd" aria-label="显示密码">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="field-err">请输入旧密码</div>
      </div>
      <div class="xh-field" id="fNew">
        <label for="new_pwd">新密码</label>
        <div class="pwd-wrap">
          <input id="new_pwd" class="xh-input" type="password" placeholder="≥8 位，含大小写字母与数字">
          <button type="button" class="pwd-eye" data-eye="new_pwd" aria-label="显示密码">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="field-err">新密码须 ≥8 位，且包含大小写字母与数字，且不能与旧密码相同</div>
      </div>
      <div class="xh-field" id="fConfirm">
        <label for="confirm_pwd">确认新密码</label>
        <div class="pwd-wrap">
          <input id="confirm_pwd" class="xh-input" type="password" placeholder="再次输入新密码">
          <button type="button" class="pwd-eye" data-eye="confirm_pwd" aria-label="显示密码">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="field-err">两次输入的新密码不一致</div>
      </div>
      <div class="session-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>
        <span>重置成功后，<b>所有设备的登录会话将立即结束</b>（包括本机），需要用新密码重新登录。</span>
      </div>
      <div class="reset-err" id="err"></div>
      <button class="xh-btn xh-btn-primary xh-btn-block" id="resetBtn" onclick="doReset()">确认重置</button>
    </form>
    <div class="reset-links">
      <a class="xh-btn xh-btn-ghost xh-btn-block" href="/login">返回登录</a>
    </div>
  </main>
<script src="/static/js/ui.js"></script>
<script>
const $=id=>document.getElementById(id);
/* 密码可见切换（事件委托，三个输入框通用） */
document.querySelectorAll('.pwd-eye').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const inp=$(btn.dataset.eye);
    const show=inp.type==='password';
    inp.type=show?'text':'password';
    btn.setAttribute('aria-label',show?'隐藏密码':'显示密码');
    btn.style.color=show?'var(--xh-info)':'';
  });
});
function mark(id,bad){$(id).classList.toggle('xh-invalid',!!bad);return !bad;}
function doReset(){
  const xh=$('xh').value.trim(),old=$('old_pwd').value,nw=$('new_pwd').value,cf=$('confirm_pwd').value;
  let ok=true;
  ok=mark('fOld',!old)&&ok;
  const ruleOk=nw.length>=8&&/[a-z]/.test(nw)&&/[A-Z]/.test(nw)&&/\d/.test(nw)&&nw!==old;
  ok=mark('fNew',!!nw&&!ruleOk)&&ok;
  ok=mark('fConfirm',!!cf&&cf!==nw)&&ok;
  if(!xh||!old||!nw||!cf){$('err').textContent='请填写完整';return;}
  if(!ruleOk){$('err').textContent='新密码不满足要求';return;}
  if(cf!==nw){$('err').textContent='两次输入的新密码不一致';return;}
  $('err').textContent='';const b=$('resetBtn');b.disabled=true;b.textContent='提交中…';
  fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({xh:xh,old_pwd:old,new_pwd:nw})})
    .then(r=>r.json()).then(d=>{
      if(d.ok){XH.toast(d.msg||'密码已更新，所有设备会话已结束','ok');
        setTimeout(()=>{location.href='/login';},1400);}
      else{$('err').textContent=d.error||'重置失败';b.disabled=false;b.textContent='确认重置';}
    })
    .catch(()=>{$('err').textContent='网络异常';b.disabled=false;b.textContent='确认重置';});
}
</script>
</body>
</html>
