<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>活动通报 · 星海工作端</title>
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/ui.css">
<style>
/* ===== 原版页面背景（保留，勿改动）：渐变底 + 光斑，本身即 fixed 定位 ===== */
:root{
  --iride-1:rgba(78,133,191,.10);--iride-2:rgba(137,170,204,.08);--iride-3:rgba(78,133,191,.07);--iride-4:rgba(137,170,204,.06);--iride-5:rgba(78,133,191,.09);
}
html body{
  background:radial-gradient(120% 70% at 50% -12%,#11161F 0%,#0B0C10 48%,var(--xh-bg) 100%);
  position:relative;overflow-x:hidden;
}
html body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 15% 18%,var(--iride-1),transparent 42%),
             radial-gradient(circle at 86% 46%,var(--iride-3),transparent 40%),
             radial-gradient(circle at 50% 88%,var(--iride-5),transparent 44%);}
html body::after{content:"";position:fixed;bottom:-140px;left:-100px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(78,133,191,.08) 0%,transparent 70%);
  pointer-events:none;z-index:0;}

  /* 页面特有：发布表单开合 + 通报卡片流 */
  .pub-form{display:none;margin-bottom:16px;}
  .pub-form.open{display:block;animation:xh-fade-in var(--xh-t-mid) var(--xh-ease);}
  .post{
    transition:transform var(--xh-t-mid) var(--xh-ease),border-color var(--xh-t-mid),box-shadow var(--xh-t-mid);
  }
  .post:hover{transform:translateY(-3px);border-color:rgba(137,170,204,.35);box-shadow:var(--xh-shadow),var(--xh-glow);}
  .post.pin{border-color:rgba(137,170,204,.45);box-shadow:var(--xh-shadow),var(--xh-glow);}
  .post.pin::before{opacity:1;}
  .post .top{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap;}
  .post .tt{font-weight:600;font-size:15.5px;color:var(--xh-text);letter-spacing:.01em;}
  .post .body{font-size:13.5px;color:var(--xh-text);line-height:1.75;white-space:pre-wrap;word-break:break-word;}
  .post .meta{font-size:12px;color:var(--xh-muted);margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .list{display:flex;flex-direction:column;gap:12px;}
  .f-err{color:var(--xh-bad);font-size:12px;min-height:14px;}
</style>
<link rel="stylesheet" href="/static/css/bg.css">
<script src="/static/js/bg.js" defer></script>
</head>
<body>
<header class="xh-topbar">
  <a class="xh-topbar-brand" href="/work"><img src="/static/uploads/logo.png" alt="">星海<em>工作端</em></a>
  <a class="xh-btn xh-btn-ghost xh-btn-sm" href="#" onclick="history.back();return false">← 返回</a>
  <div class="xh-topbar-crumb"><a href="/work">总览</a> / 活动通报</div>
  <div class="xh-topbar-spacer"></div>
  <div class="xh-topbar-user">你好，<b id="uname">—</b><span class="xh-role" id="urole">—</span><a class="xh-btn-text" href="/logout">登出</a></div>
</header>

<main class="xh-page xh-page-narrow">
  <div class="xh-page-head">
    <h1 class="xh-page-title">活动通报</h1>
    <div class="xh-page-sub">面向全体成员的通知发布，支持置顶与重要级别</div>
  </div>

  <div class="xh-toolbar">
    <button class="xh-btn xh-btn-primary" onclick="document.getElementById('form').classList.toggle('open')"><i data-lucide="plus"></i>发布通报</button>
    <div class="xh-toolbar-spacer"></div>
    <span class="xh-count" id="count">—</span>
  </div>

  <section class="xh-panel pub-form" id="form">
    <div class="xh-panel-bd">
      <div class="xh-field">
        <label for="f_title">标题<span class="xh-req">*</span></label>
        <input id="f_title" class="xh-input" placeholder="如 9月迎新晚会彩排通知">
      </div>
      <div class="xh-field" style="margin-top:12px">
        <label for="f_body">内容<span class="xh-req">*</span></label>
        <textarea id="f_body" class="xh-input" placeholder="时间、地点、注意事项…"></textarea>
      </div>
      <div class="xh-row" style="margin-top:14px">
        <div class="xh-field" style="width:160px">
          <label for="f_level">级别</label>
          <select id="f_level" class="xh-input"><option>普通</option><option>重要</option><option>紧急</option></select>
        </div>
        <label class="xh-check" style="margin-top:20px"><input type="checkbox" id="f_pinned"> 置顶</label>
      </div>
      <div class="f-err" id="fErr" style="margin-top:6px"></div>
      <div class="xh-row" style="justify-content:flex-end;margin-top:8px">
        <button class="xh-btn xh-btn-ghost" onclick="document.getElementById('form').classList.remove('open')">取消</button>
        <button class="xh-btn xh-btn-primary" id="saveBtn" onclick="save()">发布</button>
      </div>
    </div>
  </section>

  <div class="list xh-section-gap" id="list"><div class="xh-empty">加载中…</div></div>
</main>

<script src="/static/js/vendor/lucide.min.js" defer></script>
<script src="/static/js/ui.js"></script>
<script>
let uid='',role='';
const $=id=>document.getElementById(id);
fetch('/api/me').then(r=>r.json()).then(d=>{
  if(!d.ok){location.href='/login';return;}
  $('uname').textContent=d.name;$('urole').textContent=d.role;uid=d.uid;role=d.role;load();
});
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function lvTag(l){return l==='紧急'?'<span class="xh-badge bad">紧急</span>':l==='重要'?'<span class="xh-badge warn">重要</span>':'<span class="xh-badge info">普通</span>';}
function toast(m){XH.toast(m);}

function load(){
  fetch('/api/bulletin').then(r=>r.json()).then(rows=>{
    $('count').textContent='共 '+rows.length+' 条';
    const list=$('list');
    if(!rows.length){list.innerHTML='<div class="xh-empty">暂无通报，点「发布通报」发布第一条</div>';return;}
    list.innerHTML=rows.map(r=>{
      const isOwner=(r.author_xh===uid);
      const isAppr=(role==='主席'||role==='副主席');
      let op = (isOwner||isAppr) ? '<span class="xh-btn-text xh-danger-text" onclick="del('+r.id+')">删除</span>' : '';
      return '<article class="xh-panel post'+(r.pinned?' pin':'')+'">'+
        '<div class="xh-panel-bd">'+
        '<div class="top"><span class="tt">'+esc(r.title)+'</span>'+
        (r.pinned?'<span class="xh-badge info xh-ico"><i data-lucide="pin"></i>置顶</span>':'')+lvTag(r.level)+'</div>'+
        '<div class="body">'+esc(r.body)+'</div>'+
        '<div class="meta"><span>'+esc(r.author)+'</span><span class="xh-num">'+(esc(r.created)||'—')+'</span>'+(op?'<span style="margin-left:auto">'+op+'</span>':'')+'</div>'+
        '</div></article>';
    }).join('');
    XH.icons();
  });
}
function save(){
  const d={title:$('f_title').value.trim(),body:$('f_body').value.trim(),level:$('f_level').value,
    pinned:document.getElementById('f_pinned').checked};
  if(!d.title||!d.body){$('fErr').textContent='请填写标题与内容';return;}
  $('fErr').textContent='';const b=$('saveBtn');b.disabled=true;b.textContent='发布中…';
  fetch('/api/bulletin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})
    .then(r=>r.json()).then(res=>{b.disabled=false;b.textContent='发布';
      if(res.ok){toast('已发布');$('form').classList.remove('open');
        ['f_title','f_body'].forEach(i=>$(i).value='');$('f_pinned').checked=false;load();}
      else{$('fErr').textContent=res.error||'发布失败';}})
    .catch(()=>{b.disabled=false;b.textContent='发布';$('fErr').textContent='网络异常';});
}
function del(id){if(!confirm('确认删除该通报？'))return;
  fetch('/api/bulletin/'+id,{method:'DELETE'}).then(r=>r.json()).then(res=>{if(res.ok){toast('已删除');load();}else alert('删除失败');});}
</script>
</body>
</html>
