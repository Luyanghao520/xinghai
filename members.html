<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>成员信息 · 星海工作端</title>
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/ui.css">
<style>
  /* 页面特有 */
  .op-dis{opacity:.35;cursor:default;}
  .xh-tablewrap table{min-width:880px;}
  td.name{font-weight:600;color:var(--xh-text);}
  td.xh{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--xh-a1);font-weight:600;}
  .xh-modal-card{width:min(640px,100%);}
</style>
<link rel="stylesheet" href="/static/css/bg.css">
<script src="/static/js/bg.js" defer></script>
</head>
<body>
<header class="xh-topbar">
  <a class="xh-topbar-brand" href="/work"><img src="/static/uploads/logo.png" alt="">星海<em>工作端</em></a>
  <a class="xh-btn xh-btn-ghost xh-btn-sm" href="#" onclick="history.back();return false">← 返回</a>
  <div class="xh-topbar-crumb"><a href="/work">总览</a> / 成员信息</div>
  <div class="xh-topbar-spacer"></div>
  <div class="xh-topbar-user">你好，<b id="uname">—</b><span class="xh-role" id="urole">—</span><a class="xh-btn-text" href="/logout">登出</a></div>
</header>

<main class="xh-page">
  <div class="xh-page-head">
    <h1 class="xh-page-title">成员信息</h1>
    <div class="xh-page-sub">学号为唯一主键，支持检索、筛选、批量导入导出</div>
  </div>

  <div class="xh-toolbar">
    <input class="xh-input xh-grow" id="q" style="min-width:200px" placeholder="搜学号 / 姓名 / 部门 / 院系 / 专业…" oninput="debLoad()">
    <select id="fCampus" class="xh-input" onchange="load()">
      <option value="">全部校区</option>
      <option value="浦东">浦东</option>
      <option value="松江">松江</option>
    </select>
    <select id="fRole" class="xh-input" onchange="load()">
      <option value="">全部角色</option>
      <option>主席</option><option>副主席</option><option>团长</option>
      <option>团秘</option><option>部长</option><option>副部长</option>
      <option>干事</option><option>队员</option>
    </select>
    <select id="fDept" class="xh-input" onchange="load()">
      <option value="">全部部门/团队</option>
      <option>办公室</option><option>资产管理部</option><option>企宣部</option>
      <option>合唱团</option><option>交响乐团</option><option>民乐团</option><option>舞蹈团</option>
      <option>话剧团</option><option>主持团</option><option>礼仪队</option>
    </select>
    <button class="xh-btn xh-btn-primary" onclick="openForm()"><i data-lucide="plus"></i>录入成员</button>
    <button class="xh-btn xh-btn-ghost" onclick="importCSV()"><i data-lucide="upload"></i>导入</button>
    <button class="xh-btn xh-btn-ghost" onclick="exportCSV()"><i data-lucide="download"></i>导出</button>
    <input type="file" id="file" accept=".csv" style="display:none" onchange="doImport(this)">
    <div class="xh-toolbar-spacer"></div>
    <span class="xh-count" id="count">—</span>
  </div>

  <section class="xh-panel xh-panel-flush">
    <div class="xh-tablewrap">
      <table>
        <thead><tr>
          <th>学号</th><th>姓名</th><th>性别</th><th>校区</th><th>院系</th><th>专业/班级</th>
          <th>手机</th><th>角色</th><th>部门/团队</th><th>职务</th><th>届别</th><th>状态</th><th>操作</th>
        </tr></thead>
        <tbody id="tbody"><tr><td colspan="13" class="xh-empty">加载中…</td></tr></tbody>
      </table>
    </div>
  </section>

  <section class="xh-section-gap">
    <button class="xh-btn xh-btn-ghost" onclick="showAlumni()"><i data-lucide="archive"></i>离团记录</button>
  </section>
  <div id="alumniWrap" class="xh-panel xh-panel-flush" style="display:none;margin-top:14px">
    <div class="xh-panel-hd"><h3>离团记录</h3></div>
    <div class="xh-tablewrap">
      <table>
        <thead><tr><th>学号</th><th>姓名</th><th>部门/团队</th><th>届别</th><th>离团日期</th><th>离团原因</th></tr></thead>
        <tbody id="alumniBody"><tr><td colspan="6" class="xh-empty">点击上方按钮加载</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<!-- 录入/编辑弹窗 -->
<div class="xh-modal" id="mask">
  <div class="xh-modal-mask" data-close></div>
  <div class="xh-modal-card">
    <div class="xh-modal-hd">
      <h3 id="mTitle">＋ 录入成员</h3>
      <button class="xh-modal-close" onclick="closeForm()" aria-label="关闭"><i data-lucide="x"></i></button>
    </div>
    <div class="xh-modal-bd">
      <div class="xh-page-sub" style="margin:0 0 16px">学号为唯一主键（9 位数字，如 251400143）。重复学号将自动更新。</div>
      <div class="xh-form-grid">
        <div class="xh-field"><label>学号<span class="xh-req">*</span></label><input id="f_xh" class="xh-input" placeholder="9 位数字" maxlength="9" inputmode="numeric"></div>
        <div class="xh-field"><label>姓名<span class="xh-req">*</span></label><input id="f_name" class="xh-input" placeholder="姓名"></div>
        <div class="xh-field"><label>性别</label><select id="f_gender" class="xh-input"><option></option><option>男</option><option>女</option></select></div>
        <div class="xh-field"><label>校区</label><select id="f_campus" class="xh-input"><option></option><option>浦东</option><option>松江</option></select></div>
        <div class="xh-field"><label>学院</label><input id="f_college" class="xh-input" placeholder="如 国际商务学院"></div>
        <div class="xh-field"><label>专业/班级</label><input id="f_major" class="xh-input" placeholder="如 国际商务 2401"></div>
        <div class="xh-field"><label>手机号</label><input id="f_phone" class="xh-input" placeholder="11 位手机号"></div>
        <div class="xh-field"><label>微信</label><input id="f_wechat" class="xh-input" placeholder="微信号"></div>
        <div class="xh-field"><label>邮箱</label><input id="f_email" class="xh-input" placeholder="邮箱"></div>
        <div class="xh-field"><label>角色</label><select id="f_role" class="xh-input">
          <option></option><option>主席</option><option>副主席</option><option>团长</option>
          <option>团秘</option><option>部长</option><option>副部长</option><option>干事</option><option>队员</option>
        </select></div>
        <div class="xh-field"><label>职务</label><select id="f_position" class="xh-input">
          <option></option><option>教师</option><option>主席</option><option>副主席</option><option>团秘</option>
          <option>部长</option><option>副部长</option><option>组长</option>
          <option>团长</option><option>副团长</option><option>团干</option><option>成员</option>
        </select></div>
        <div class="xh-field"><label>所属部门/团队</label><input id="f_dept" class="xh-input" placeholder="如 合唱团 / 办公室"></div>
        <div class="xh-field"><label>入团时间</label><input id="f_join_date" class="xh-input" placeholder="如 2024-09"></div>
        <div class="xh-field"><label>届别</label><input id="f_grade" class="xh-input" placeholder="如 2024 级"></div>
        <div class="xh-field"><label>状态</label><select id="f_status" class="xh-input"><option></option><option>在团</option><option>休团</option><option>退团</option></select></div>
        <div class="xh-field xh-span-2"><label>特长/经历</label><textarea id="f_skill" class="xh-input" placeholder="获奖、擅长的领域等"></textarea></div>
        <div class="xh-field xh-span-2"><label>备注</label><textarea id="f_note" class="xh-input" placeholder="备注信息"></textarea></div>
      </div>
      <div class="f-err" id="fErr" style="margin-top:12px"></div>
      <div class="xh-row" style="justify-content:flex-end;margin-top:12px">
        <button class="xh-btn xh-btn-ghost" onclick="closeForm()">取消</button>
        <button class="xh-btn xh-btn-primary" id="saveBtn" onclick="save()">保存</button>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/vendor/lucide.min.js" defer></script>
<script src="/static/js/ui.js"></script>
<script>
const COLS=["xh","name","gender","campus","college","major","phone","wechat","email","role","dept","position","join_date","grade","status","skill","note"];
const $ = id => document.getElementById(id);
let editing=null, timer=null;

fetch('/api/me').then(r=>r.json()).then(d=>{
  if(!d.ok){location.href='/login';return;}
  $('uname').textContent=d.name;$('urole').textContent=d.role;
  window._canLeave=(d.role==='主席'||d.role==='副主席');
  load();
});

function statusTag(s){
  if(s==='在团') return '<span class="xh-badge ok">在团</span>';
  if(s==='退团') return '<span class="xh-badge bad">退团</span>';
  if(s==='休团') return '<span class="xh-badge neutral">休团</span>';
  return s?('<span class="xh-badge neutral">'+esc(s)+'</span>'):'';
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function debLoad(){clearTimeout(timer);timer=setTimeout(load,250);}
function load(){
  const q=$('q').value.trim(), cam=$('fCampus').value, role=$('fRole').value, dept=$('fDept').value;
  const p=new URLSearchParams();
  if(q)p.set('q',q); if(cam)p.set('campus',cam); if(role)p.set('role',role); if(dept)p.set('dept',dept);
  fetch('/api/members?'+p.toString()).then(r=>r.json()).then(rows=>{
    const tb=$('tbody');
    $('count').textContent='共 '+rows.length+' 条';
    if(!rows.length){tb.innerHTML='<tr><td colspan="13" class="xh-empty">暂无成员，点「＋ 录入成员」开始录入</td></tr>';return;}
    tb.innerHTML=rows.map(r=>{
      return '<tr>'+
        '<td class="xh">'+esc(r.xh)+'</td>'+
        '<td class="name">'+esc(r.name)+'</td>'+
        '<td>'+(esc(r.gender)||'—')+'</td>'+
        '<td>'+(esc(r.campus)||'—')+'</td>'+
        '<td>'+(esc(r.college)||'—')+'</td>'+
        '<td>'+(esc(r.major)||'—')+'</td>'+
        '<td>'+(esc(r.phone)||'—')+'</td>'+
        '<td>'+(esc(r.role)?'<span class="xh-badge info">'+esc(r.role)+'</span>':'—')+'</td>'+
        '<td>'+(esc(r.dept)||'—')+'</td>'+
        '<td>'+(esc(r.position)||'—')+'</td>'+
        '<td>'+(esc(r.grade)||'—')+'</td>'+
        '<td>'+statusTag(r.status)+'</td>'+
        '<td style="white-space:nowrap"><span class="xh-btn-text" onclick="openForm(\''+esc(r.xh)+'\')">编辑</span>'+
        '<span class="xh-btn-text xh-danger-text" onclick="del(\''+esc(r.xh)+'\')">删除</span>'+
        (window._canLeave?'<span class="xh-btn-text" style="color:var(--xh-warn)" onclick="leave(\''+esc(r.xh)+'\',\''+esc(r.name)+'\')">离团</span>':'')+'</td>'+
      '</tr>';
    }).join('');
  });
}

function openForm(xh){
  editing=null;
  $('mTitle').textContent='＋ 录入成员';
  $('fErr').textContent='';
  COLS.forEach(c=>{const el=$('f_'+c);if(el)el.value='';});
  $('f_status').value='在团';
  if(xh){
    const row=[...document.querySelectorAll('#tbody tr')].find(tr=>tr.querySelector('.xh')&&tr.querySelector('.xh').textContent===xh);
    fetch('/api/members?q='+encodeURIComponent(xh)).then(r=>r.json()).then(rows=>{
      const r=rows.find(x=>x.xh===xh);if(!r)return;
      editing=xh;$('mTitle').textContent='编辑 '+r.name;
      COLS.forEach(c=>{const el=$('f_'+c);if(el)el.value=r[c]||'';});
    });
  }
  XH.modal.open('mask');
}
function closeForm(){XH.modal.close('mask');editing=null;}

function save(){
  const d={};
  COLS.forEach(c=>{const el=$('f_'+c);if(el)d[c]=el.value.trim();});
  if(!d.xh||!d.name){$('fErr').textContent='学号和姓名为必填';return;}
  if(!/^\d{9}$/.test(d.xh)){$('fErr').textContent='学号须为 9 位数字（如 251400143）';return;}
  const btn=$('saveBtn');btn.disabled=true;btn.textContent='保存中…';
  fetch('/api/members',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})
    .then(r=>r.json()).then(res=>{
      btn.disabled=false;btn.textContent='保存';
      if(res.ok){toast(editing?'已更新 '+d.name:'已录入 '+d.name);closeForm();load();}
      else{$('fErr').textContent=res.error||'保存失败';}
    }).catch(()=>{btn.disabled=false;btn.textContent='保存';$('fErr').textContent='网络异常';});
}

function del(xh){
  if(!confirm('确认删除学号 '+xh+' 的成员记录？此操作不可撤销。'))return;
  fetch('/api/members/'+xh,{method:'DELETE'}).then(r=>r.json()).then(res=>{
    if(res.ok){toast('已删除');load();}else toast('删除失败');
  });
}

function exportCSV(){window.open('/api/members/export','_blank');}
function importCSV(){$('file').click();}
function doImport(input){
  const f=input.files[0];if(!f)return;
  const fd=new FormData();fd.append('file',f);
  toast('导入中…');
  fetch('/api/members/import',{method:'POST',body:fd}).then(r=>r.json()).then(res=>{
    if(res.ok){toast('成功导入 '+res.imported+' 条');load();}
    else toast(res.error||'导入失败');
    input.value='';
  }).catch(()=>{toast('导入异常');input.value='';});
}

function toast(msg){XH.toast(msg);}
function leave(xh,name){
  const reason=prompt('离团原因（选填）：');if(reason===null)return;
  fetch('/api/members/'+xh+'/leave',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:reason||''})})
    .then(r=>r.json()).then(res=>{if(res.ok){toast(name+' 已标记离团');load();}else toast(res.error);});
}
function showAlumni(){
  const w=document.getElementById('alumniWrap');
  if(w.style.display==='block'){w.style.display='none';return;}
  w.style.display='block';
  fetch('/api/alumni').then(r=>r.json()).then(rows=>{
    const tb=document.getElementById('alumniBody');
    if(!rows.length){tb.innerHTML='<tr><td colspan="6" class="xh-empty">暂无离团记录</td></tr>';return;}
    tb.innerHTML=rows.map(r=>'<tr><td>'+esc(r.xh)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.dept||'—')+'</td><td>'+esc(r.grade||'—')+'</td><td>'+esc(r.leave_date||'—')+'</td><td>'+esc(r.leave_reason||'—')+'</td></tr>').join('');
  });
}
</script>
</body>
</html>
