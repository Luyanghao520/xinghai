<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>星海工作端 · 登录</title>
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/ui.css">
<link rel="stylesheet" href="/static/css/bg.css">
<style>
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  .login-card{width:400px;max-width:94vw;padding:34px 30px 28px;}
  .login-brand{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;}
  .login-brand img{width:60px;height:60px;border-radius:50%;box-shadow:var(--xh-glow),0 8px 30px rgba(0,0,0,.5);}
  .login-brand h1{
    margin:0;font-family:var(--xh-font-display);font-weight:600;
    font-size:22px;letter-spacing:.08em;color:var(--xh-text);
  }
  .login-brand h1 em{
    font-style:normal;
    background-image:var(--xh-accent);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .login-sub{font-size:12px;color:var(--xh-muted);letter-spacing:.3em;}
  .login-fields{display:flex;flex-direction:column;gap:16px;margin-top:26px;}
  /* 密码可见切换 */
  .pwd-wrap{position:relative;}
  .pwd-wrap .xh-input{padding-right:44px;}
  .pwd-eye{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:32px;height:32px;border:none;border-radius:8px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    background:transparent;color:var(--xh-muted);transition:color var(--xh-t-fast),background var(--xh-t-fast);
  }
  .pwd-eye:hover{color:var(--xh-text);background:rgba(255,255,255,.06);}
  .pwd-eye svg{width:16px;height:16px;}
  /* 保持登录 + 忘记密码 */
  .login-aux{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:-4px;}
  .login-aux a{font-size:12px;color:var(--xh-muted);text-decoration:none;transition:color var(--xh-t-fast);}
  .login-aux a:hover{color:var(--xh-info);}
  /* 三方登录行 */
  .login-div{display:flex;align-items:center;gap:12px;margin-top:22px;color:#5A5A60;font-size:11px;letter-spacing:.1em;}
  .login-div::before,.login-div::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.07);}
  .provider-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
  .provider-row .xh-btn-ghost{height:38px;font-size:12.5px;}
  .err{color:var(--xh-bad);font-size:12.5px;text-align:center;min-height:18px;line-height:1.5;}
  .login-links{display:flex;flex-direction:column;gap:10px;margin-top:20px;}
  .login-back{display:block;text-align:center;font-size:12.5px;color:var(--xh-muted);text-decoration:none;transition:color var(--xh-t-fast);}
  .login-back:hover{color:var(--xh-text);}
  @media (max-width:420px){
    body{align-items:flex-start;padding-top:8vh;}
    .login-card{padding:26px 18px 22px;}
  }
</style>
<script src="/static/js/bg.js" defer></script>
</head>
<body>
  <main class="xh-panel login-card">
    <div class="login-brand">
      <img src="/static/uploads/logo.png" alt="星海艺术团">
      <h1>星海<em>艺术团</em> · 工作端</h1>
      <div class="login-sub">成员 / 干部 统一登录</div>
    </div>
    <div class="login-fields">
      <div class="xh-field">
        <label for="xh">学号 / 工号</label>
        <input id="xh" class="xh-input" placeholder="如 251400143" autocomplete="off" inputmode="numeric">
      </div>
      <div class="xh-field">
        <label for="pwd">密码</label>
        <div class="pwd-wrap">
          <input id="pwd" class="xh-input" type="password" placeholder="请输入密码">
          <button type="button" class="pwd-eye" id="eyeBtn" aria-label="显示密码" onclick="togglePwd()">
            <svg id="eyeOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
          </button>
        </div>
      </div>
      <div class="login-aux">
        <label class="xh-check" style="font-size:12.5px"><input type="checkbox" id="keep"> 保持登录</label>
        <a href="/reset">忘记密码？</a>
      </div>
      <button class="xh-btn xh-btn-primary xh-btn-block" id="loginBtn" onclick="doLogin()">登 录</button>
      <div class="err" id="err"></div>
    </div>

    <div class="login-div">第三方登录</div>
    <div class="provider-row">
      <button type="button" class="xh-btn xh-btn-ghost" onclick="provider('QQ')">QQ</button>
      <button type="button" class="xh-btn xh-btn-ghost" onclick="provider('微信')">微信</button>
      <button type="button" class="xh-btn xh-btn-ghost" onclick="provider('钉钉')">钉钉</button>
    </div>

    <div class="login-links">
      <a class="xh-btn xh-btn-ghost xh-btn-block" href="/register">新成员注册申请</a>
      <a class="login-back" href="#" onclick="if(window.history.length>1){history.back();}else{location.href='/';}return false">← 返回官网</a>
    </div>
  </main>
<script src="/static/js/ui.js"></script>
<script>
  const $=id=>document.getElementById(id);
  /* 密码可见切换 */
  function togglePwd(){
    const pwd=$('pwd'),on=$('eyeOn'),off=$('eyeOff');
    const show=pwd.type==='password';
    pwd.type=show?'text':'password';
    on.style.display=show?'none':'block';
    off.style.display=show?'block':'none';
    $('eyeBtn').setAttribute('aria-label',show?'隐藏密码':'显示密码');
  }
  /* 保持登录：记住学号 */
  try{
    if(localStorage.getItem('xh-remember')==='1'){
      $('keep').checked=true;
      const saved=localStorage.getItem('xh-saved');if(saved)$('xh').value=saved;
    }
  }catch(e){}
  function provider(name){XH.toast(name+' 登录暂未开通，请使用学号登录','warn');}
  function doLogin(){
    const xh=$('xh').value.trim();
    const pwd=$('pwd').value;
    const err=$('err');const btn=$('loginBtn');
    if(!xh||!pwd){err.textContent='请输入学号/工号和密码';return;}
    try{
      if($('keep').checked){localStorage.setItem('xh-remember','1');localStorage.setItem('xh-saved',xh);}
      else{localStorage.removeItem('xh-remember');localStorage.removeItem('xh-saved');}
    }catch(e){}
    btn.disabled=true;btn.textContent='登录中…';err.textContent='';
    fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({xh:xh,pwd:pwd})})
      .then(r=>r.json()).then(d=>{
        if(d.ok){location.href='/work';}
        else{err.textContent=d.error||'登录失败';btn.disabled=false;btn.textContent='登 录';}
      }).catch(()=>{err.textContent='网络异常';btn.disabled=false;btn.textContent='登 录';});
  }
  $('pwd').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
</body>
</html>
