<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>注册申请 · 星海艺术团</title>
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/ui.css">
<style>
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  .reg-card{width:400px;max-width:94vw;padding:30px 28px 26px;}
  .reg-brand{text-align:center;margin-bottom:20px;}
  .reg-brand h1{
    margin:0;font-family:var(--xh-font-display);font-weight:600;
    font-size:22px;letter-spacing:.08em;color:var(--xh-text);
  }
  .reg-brand h1 em{
    font-style:normal;
    background-image:var(--xh-accent);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .reg-sub{font-size:12.5px;color:var(--xh-muted);margin-top:6px;}
  .reg-form{display:flex;flex-direction:column;gap:14px;}
  .reg-err{color:var(--xh-bad);font-size:12.5px;text-align:center;min-height:18px;line-height:1.5;}
  .reg-links{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .reg-back{display:block;text-align:center;font-size:12.5px;color:var(--xh-muted);text-decoration:none;transition:color var(--xh-t-fast);}
  .reg-back:hover{color:var(--xh-text);}
  @media (max-width:420px){
    body{align-items:flex-start;padding-top:6vh;}
    .reg-card{padding:24px 18px 20px;}
  }
</style>
<link rel="stylesheet" href="/static/css/bg.css">
<script src="/static/js/bg.js" defer></script>
</head>
<body>
  <main class="xh-panel reg-card">
    <div class="reg-brand">
      <h1>星海<em>艺术团</em> · 注册申请</h1>
      <div class="reg-sub">提交后需管理员审批通过方可登录</div>
    </div>
    <div class="reg-form">
      <div class="xh-field">
        <label for="xh">学号<span class="xh-req">*</span></label>
        <input id="xh" class="xh-input" placeholder="9 位数字学号" maxlength="9" inputmode="numeric" autocomplete="off">
      </div>
      <div class="xh-field">
        <label for="pwd">密码<span class="xh-req">*</span></label>
        <input id="pwd" class="xh-input" type="password" placeholder="至少 8 位，含大小写与数字">
        <div class="xh-hint">须至少 8 位，且同时包含大写字母、小写字母、数字</div>
      </div>
      <div class="xh-field">
        <label for="confirm_pwd">确认密码<span class="xh-req">*</span></label>
        <input id="confirm_pwd" class="xh-input" type="password" placeholder="再次输入密码">
      </div>
      <div class="xh-field">
        <label for="name">姓名<span class="xh-req">*</span></label>
        <input id="name" class="xh-input" placeholder="真实姓名">
      </div>
      <div class="xh-field">
        <label for="campus">校区<span class="xh-req">*</span></label>
        <select id="campus" class="xh-input">
          <option value="">请选择</option>
          <option>浦东</option>
          <option>松江</option>
        </select>
      </div>
      <div class="reg-err" id="err"></div>
      <button class="xh-btn xh-btn-primary xh-btn-block" id="btn" onclick="reg()">提交申请</button>
    </div>
    <div class="reg-links">
      <a class="xh-btn xh-btn-ghost xh-btn-block" href="/login">已有账号？去登录</a>
      <a class="reg-back" href="#" onclick="history.back();return false">← 返回</a>
    </div>
  </main>
<script src="/static/js/vendor/lucide.min.js" defer></script>
<script src="/static/js/ui.js"></script>
<script>
const $=id=>document.getElementById(id);
function reg(){
  const pwd=document.getElementById('pwd').value;
  if(pwd.length<8||!/[a-z]/.test(pwd)||!/[A-Z]/.test(pwd)||!/\d/.test(pwd)){document.getElementById('err').textContent='密码须≥8位，包含大小写字母和数字';return;}
  if($('confirm_pwd').value!==pwd){document.getElementById('err').textContent='两次输入的密码不一致';return;}
  const d={xh:document.getElementById('xh').value.trim(),pwd:pwd,name:document.getElementById('name').value.trim(),campus:document.getElementById('campus').value};
  if(!d.xh||!d.pwd||!d.name||!d.campus){$('err').textContent='请填写完整信息';return;}
  $('err').textContent='';const b=$('btn');b.disabled=true;b.textContent='提交中…';
  fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})
    .then(r=>r.json()).then(res=>{b.disabled=false;b.textContent='提交申请';
      if(res.ok){XH.toast(res.msg||'已提交，等待审批','ok');
        ['xh','pwd','name'].forEach(i=>$(i).value='');$('campus').value='';}
      else{$('err').textContent=res.error||'提交失败';}})
    .catch(()=>{b.disabled=false;b.textContent='提交申请';$('err').textContent='网络异常';});
}
</script>
</body>
</html>
