<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>报销申请 · 星海工作端</title>
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/ui.css">
<style>
/* ===== 原版页面背景（保留，勿改动）：渐变底 + 流动光斑，本身即 fixed 定位 ===== */
:root{
  --iride-1:rgba(78,133,191,.10);--iride-2:rgba(137,170,204,.08);--iride-3:rgba(78,133,191,.07);--iride-4:rgba(137,170,204,.06);--iride-5:rgba(78,133,191,.09);
}
html body{
  background:radial-gradient(120% 70% at 50% -12%,#11161F 0%,#0B0C10 48%,var(--xh-bg) 100%);
  position:relative;overflow-x:hidden;
}
@keyframes spot1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(22px,-16px) scale(1.04);}}
@keyframes spot2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-20px,14px) scale(1.05);}}
html body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 15% 18%,var(--iride-1),transparent 42%),
             radial-gradient(circle at 86% 46%,var(--iride-3),transparent 40%),
             radial-gradient(circle at 50% 88%,var(--iride-5),transparent 44%);
  animation:spot1 12s ease-in-out infinite;}
html body::after{content:"";position:fixed;bottom:-140px;left:-100px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(78,133,191,.08) 0%,transparent 70%);
  pointer-events:none;z-index:0;animation:spot2 14s ease-in-out infinite;}
.spot{position:fixed;top:50%;left:50%;width:520px;height:520px;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 50% 50%,rgba(137,170,204,.04),transparent 60%);
  border-radius:50%;pointer-events:none;z-index:0;}

  /* 页面特有：开合表单 / 凭证上传 / 金额列 */
  .pub-form{display:none;margin-bottom:16px;}
  .pub-form.open{display:block;animation:xh-fade-in var(--xh-t-mid) var(--xh-ease);}
  .f-err{color:var(--xh-bad);font-size:12px;min-height:14px;}
  .op-dis{opacity:.35;cursor:default;}
  .upp{margin-top:18px;padding-top:16px;border-top:1px dashed var(--xh-stroke-2);}
  .upp-h{font-size:12px;color:var(--xh-muted);font-weight:600;margin-bottom:10px;letter-spacing:.04em;}
  input.xh-input[type="file"]{padding:8px 10px;font-size:12px;color:var(--xh-muted);}
  input.xh-input[type="file"]::file-selector-button{
    border:none;border-radius:999px;padding:7px 15px;font-size:12px;font-weight:600;cursor:pointer;
    color:#0A0F16;background-image:var(--xh-accent);margin-right:10px;transition:filter var(--xh-t-fast),box-shadow var(--xh-t-fast);
  }
  input.xh-input[type="file"]::file-selector-button:hover{filter:brightness(1.1);box-shadow:0 3px 14px rgba(78,133,191,.35);}
  .prev{margin-top:8px;max-width:100%;max-height:84px;border-radius:10px;border:1px solid var(--xh-glass-border);display:none;}
  .xh-tablewrap table{min-width:760px;}
  td.title{font-weight:600;color:var(--xh-text);white-space:normal;min-width:140px;}
  td.amt{font-family:var(--xh-font-display);font-weight:600;font-size:14.5px;color:var(--xh-info);font-variant-numeric:tabular-nums;}
  .cellimg{height:36px;border-radius:8px;border:1px solid var(--xh-glass-border);vertical-align:middle;cursor:zoom-in;transition:transform var(--xh-t-fast),box-shadow var(--xh-t-fast);}
  .cellimg:hover{transform:scale(1.12);box-shadow:var(--xh-glow);}
  .imgs{white-space:nowrap;}
  .imgs a{margin-right:3px;}
</style>
<link rel="stylesheet" href="/static/css/bg.css">
<script src="/static/js/bg.js" defer></script>
</head>
<body>
<div class="spot"></div>
<header class="xh-topbar">
  <a class="xh-topbar-brand" href="/work"><img src="/static/uploads/logo.png" alt="">星海<em>工作端</em></a>
  <a class="xh-btn xh-btn-ghost xh-btn-sm" href="#" onclick="history.back();return false">← 返回</a>
  <div class="xh-topbar-crumb"><a href="/work">总览</a> / 报销申请</div>
  <div class="xh-topbar-spacer"></div>
  <div class="xh-topbar-user">你好，<b id="uname">—</b><span class="xh-role" id="urole">—</span><a class="xh-btn-text" href="/logout">登出</a></div>
</header>

<main class="xh-page">
  <div class="xh-page-head">
    <h1 class="xh-page-title">报销申请</h1>
    <div class="xh-page-sub">提交报销凭证，主席团审批通过后财务打款，可导出 Word 申请单</div>
  </div>

  <div class="xh-toolbar">
    <button class="xh-btn xh-btn-primary" onclick="document.getElementById('form').classList.toggle('open')"><i data-lucide="plus"></i>新建报销</button>
    <div class="xh-tabs">
      <button id="tAll" class="xh-tab on" onclick="setView('all')">全部</button>
      <button id="tMine" class="xh-tab" onclick="setView('mine')">我的</button>
    </div>
    <div class="xh-toolbar-spacer"></div>
    <span class="xh-count" id="count">—</span>
  </div>

  <section class="xh-panel pub-form" id="form">
    <div class="xh-panel-bd">
      <div class="xh-form-grid">
        <div class="xh-field">
          <label for="f_title">报销事项<span class="xh-req">*</span></label>
          <input id="f_title" class="xh-input" placeholder="如 合唱团演出服装采购">
        </div>
        <div class="xh-field">
          <label for="f_category">类别<span class="xh-req">*</span></label>
          <select id="f_category" class="xh-input">
            <option></option><option>器材采购</option><option>活动经费</option><option>差旅</option><option>培训</option><option>其他</option>
          </select>
        </div>
        <div class="xh-field">
          <label for="f_amount">金额（元）<span class="xh-req">*</span></label>
          <input id="f_amount" class="xh-input" type="number" min="0" step="0.01" placeholder="如 358.50">
        </div>
        <div class="xh-field">
          <label for="f_note">说明</label>
          <input id="f_note" class="xh-input" placeholder="发票 / 用途说明">
        </div>
      </div>
      <div class="upp">
        <div class="upp-h">凭证材料（发票 / 付款记录 / 到货证明 / 签收人签字，必传 4 张）</div>
        <div class="xh-form-grid">
          <div class="xh-field"><label>发票照片</label><input type="file" id="f_inv" class="xh-input" accept="image/*"><img class="prev" id="p_inv" alt=""></div>
          <div class="xh-field"><label>付款记录</label><input type="file" id="f_pay" class="xh-input" accept="image/*"><img class="prev" id="p_pay" alt=""></div>
          <div class="xh-field"><label>到货证明</label><input type="file" id="f_proof" class="xh-input" accept="image/*"><img class="prev" id="p_proof" alt=""></div>
          <div class="xh-field"><label>签收人签字</label><input type="file" id="f_sign" class="xh-input" accept="image/*"><img class="prev" id="p_sign" alt=""></div>
        </div>
      </div>
      <div class="f-err" id="fErr" style="margin-top:12px"></div>
      <div class="xh-row" style="justify-content:flex-end;margin-top:10px">
        <button class="xh-btn xh-btn-ghost" onclick="document.getElementById('form').classList.remove('open')">取消</button>
        <button class="xh-btn xh-btn-primary" id="saveBtn" onclick="save()">提交申请</button>
      </div>
    </div>
  </section>

  <section class="xh-panel xh-panel-flush xh-section-gap">
    <div class="xh-tablewrap">
      <table>
        <thead><tr><th>ID</th><th>事项</th><th>类别</th><th>金额</th><th>申请人</th><th>状态</th><th>凭证</th><th>提交时间</th><th>操作</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="9" class="xh-empty">加载中…</td></tr></tbody>
      </table>
    </div>
  </section>
</main>

<script src="/static/js/vendor/lucide.min.js" defer></script>
<script src="/static/js/ui.js"></script>
<script>
let role='', view='all', uid='';
const $=id=>document.getElementById(id);
fetch('/api/me').then(r=>r.json()).then(d=>{
  if(!d.ok){location.href='/login';return;}
  $('uname').textContent=d.name;$('urole').textContent=d.role;role=d.role;uid=d.uid;load();
});
['inv','pay','proof','sign'].forEach(k=>{
  const el=$('f_'+k); if(el) el.addEventListener('change',e=>{
    const f=e.target.files[0]; const p=$('p_'+k);
    if(!f){if(p)p.style.display='none';return;}
    const rd=new FileReader(); rd.onload=ev=>{if(p){p.src=ev.target.result;p.style.display='block';}}; rd.readAsDataURL(f);
  });
});

function setView(v){view=v;$('tAll').classList.toggle('on',v==='all');$('tMine').classList.toggle('on',v==='mine');load();}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function statusTag(s){return s==='已通过'?'<span class="xh-badge ok">已通过</span>':s==='已驳回'?'<span class="xh-badge bad">已驳回</span>':'<span class="xh-badge warn">待审</span>';}
function amt(v){return '¥'+(+v).toFixed(2);}
function toast(m){XH.toast(m);}

function load(){
  const p=new URLSearchParams();if(view==='mine')p.set('mine','1');
  fetch('/api/reimburse?'+p.toString()).then(r=>r.json()).then(rows=>{
    $('count').textContent='共 '+rows.length+' 条';
    const tb=$('tbody');
    if(!rows.length){tb.innerHTML='<tr><td colspan="8" class="xh-empty">暂无报销记录</td></tr>';return;}
    tb.innerHTML=rows.map(r=>{
      const isOwner=(r.xh===uid);
      const isAppr=(role==='主席'||role==='副主席');
      const imgCell=u=>u?'<a href="'+u+'" target="_blank"><img class="cellimg" src="'+u+'"></a>':'<span class="xh-muted">—</span>';
      const imgs=imgCell(r.inv_img)+imgCell(r.pay_img)+imgCell(r.proof_img)+imgCell(r.sign_img);
      let ops='<span class="xh-btn-text xh-danger-text" onclick="del('+r.id+')">删除</span>';
      if(isOwner||isAppr){ops+='<span class="xh-btn-text" onclick="dl('+r.id+')">下载Word</span>';}
      if(isAppr&&r.status==='待审'){
        ops+='<span class="xh-btn-text" onclick="setSt('+r.id+',\'已通过\')">通过</span>'+
             '<span class="xh-btn-text" onclick="setSt('+r.id+',\'已驳回\')">驳回</span>';
      } else if(!isAppr&&!isOwner){ops='<span class="xh-btn-text op-dis">—</span>';}
      return '<tr><td class="xh-num">'+r.id+'</td><td class="title">'+esc(r.title)+'</td><td>'+(esc(r.category)||'—')+
        '</td><td class="amt">'+amt(r.amount)+'</td><td>'+esc(r.name)+'</td><td>'+statusTag(r.status)+
        '</td><td class="imgs">'+imgs+'</td><td class="xh-num">'+(esc(r.created)||'—')+'</td><td style="white-space:nowrap">'+ops+'</td></tr>';
    }).join('');
  });
}

async function uploadOne(id){
  const f=$(id).files[0];
  if(!f) return '';
  const fd=new FormData(); fd.append('file',f);
  try{ const r=await fetch('/api/upload',{method:'POST',body:fd}); const j=await r.json(); return j.ok? j.url : ''; }
  catch(e){ return ''; }
}
async function save(){
  const d={title:$('f_title').value.trim(),category:$('f_category').value.trim(),
    amount:$('f_amount').value.trim(),note:$('f_note').value.trim()};
  if(!d.title||!d.category||!d.amount){$('fErr').textContent='请填写事项、类别与金额';return;}
  if(!['f_inv','f_pay','f_proof','f_sign'].every(i=>$(i).files[0])){
    $('fErr').textContent='请上传全部 4 张凭证图（发票/付款记录/到货证明/签收人签字）';return;
  }
  $('fErr').textContent='';const b=$('saveBtn');b.disabled=true;b.textContent='上传图片…';
  d.inv_img=await uploadOne('f_inv');
  d.pay_img=await uploadOne('f_pay');
  d.proof_img=await uploadOne('f_proof');
  d.sign_img=await uploadOne('f_sign');
  b.textContent='提交中…';
  fetch('/api/reimburse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})
    .then(r=>r.json()).then(res=>{b.disabled=false;b.textContent='提交申请';
      if(res.ok){toast('已提交，等待审批');$('form').classList.remove('open');
        ['f_title','f_category','f_amount','f_note'].forEach(i=>$(i).value='');
        ['f_inv','f_pay','f_proof','f_sign'].forEach(i=>{$(i).value='';const p=$('p_'+i.slice(2));if(p){p.src='';p.style.display='none';}});
        load();}
      else{$('fErr').textContent=res.error||'提交失败';}})
    .catch(()=>{b.disabled=false;b.textContent='提交申请';$('fErr').textContent='网络异常';});
}
function del(id){if(!confirm('确认删除该报销记录？'))return;
  fetch('/api/reimburse/'+id,{method:'DELETE'}).then(r=>r.json()).then(res=>{if(res.ok){toast('已删除');load();}else alert('删除失败');});}
function dl(id){window.open('/api/reimburse/'+id+'/export');}
function setSt(id,st){fetch('/api/reimburse/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:st})})
  .then(r=>r.json()).then(res=>{if(res.ok){toast('已'+st);load();}else alert(res.error||'操作失败');});}
</script>
</body>
</html>
