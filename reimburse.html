<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>报销申请 · 星海工作端</title>
<style>
/* ================= 星海 · 暗夜星海设计框架 ================= */
:root{
  --bg:#0A0A0A; --surface:#141414; --raised:#1A1A1C;
  --text:#F5F5F5; --muted:#8A8A8A;
  --stroke:#1F1F1F; --stroke2:#2A2A2E;
  --a1:#89AACC; --a2:#4E85BF;
  --accent:linear-gradient(90deg,#89AACC 0%,#4E85BF 100%);
  --glow:0 0 24px rgba(137,170,204,.16);
  --ok:#7FD1A7; --warn:#E8C07A; --bad:#E08A8A; --red:#E08A8A; --accent-soft:#BCD4EA;
  --font-body:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  --font-display:'Instrument Serif','Noto Serif SC','Songti SC','STSong',serif;
  /* 旧变量兼容映射：保留变量名，值指向新令牌 */
  --navy:#F5F5F5;--blue:#89AACC;--gold:#89AACC;--gold-2:#C2D8EC;--ink:#F5F5F5;--sub:#8A8A8A;--line:#1F1F1F;--card:#141414;
  --grad-hero:linear-gradient(160deg,#0A0A0A 0%,#0D1320 45%,#101828 100%);
  --iride-1:rgba(78,133,191,.10);--iride-2:rgba(137,170,204,.08);--iride-3:rgba(78,133,191,.07);--iride-4:rgba(137,170,204,.06);--iride-5:rgba(78,133,191,.09);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{color-scheme:dark;}
::selection{background:rgba(137,170,204,.35);}

/* ===== Body 背景：暗夜星海 ===== */
html body{
  font-family:var(--font-body);
  background:radial-gradient(120% 70% at 50% -12%,#11161F 0%,#0B0C10 48%,var(--bg) 100%);
  color:var(--ink);line-height:1.7;min-height:100vh;
  position:relative;overflow-x:hidden;
}
@keyframes spot1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(22px,-16px) scale(1.04);}}
@keyframes spot2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-20px,14px) scale(1.05);}}
html body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 15% 18%,var(--iride-1),transparent 42%),
             radial-gradient(circle at 86% 46%,var(--iride-3),transparent 40%),
             radial-gradient(circle at 50% 88%,var(--iride-5),transparent 44%);
  animation:spot1 12s ease-in-out infinite;}
html body::after{content:"";position:fixed;bottom:-140px;left:-100px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(78,133,191,.08) 0%,transparent 70%);
  pointer-events:none;z-index:0;animation:spot2 14s ease-in-out infinite;}
.spot{position:fixed;top:50%;left:50%;width:520px;height:520px;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 50% 50%,rgba(137,170,204,.04),transparent 60%);
  border-radius:50%;pointer-events:none;z-index:0;}

/* ===== 顶部导航条：sticky 暗色玻璃 ===== */
header{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;padding:12px 24px;height:54px;
  background:rgba(20,20,20,.85);
  backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
  border-bottom:1px solid var(--stroke);}
.brand{font-weight:700;font-size:16px;color:var(--text);letter-spacing:.05em;display:flex;align-items:center;gap:6px;}
.brand span{background-image:var(--accent);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;}
.crumb{font-size:12.5px;color:var(--muted);}
.crumb a{color:var(--blue);text-decoration:none;transition:color .2s;}
.crumb a:hover{color:var(--accent-soft);}
.user{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px;}
.user b{color:var(--text);font-weight:600;}
.user a{margin-left:12px;color:var(--blue);text-decoration:none;font-weight:600;padding:4px 12px;border-radius:999px;font-size:12.5px;border:1px solid var(--stroke2);transition:border-color .2s,color .2s,background .2s;}
.user a:hover{border-color:var(--a1);color:var(--a1);background:rgba(137,170,204,.06);}
/* 返回链接：HTML 属性里的内联浅色描边，用样式表压制为暗色药丸 */
header>a[href="#"]{border-color:#2A2A2E !important;background:rgba(137,170,204,.05) !important;border-radius:999px !important;transition:border-color .2s,background .2s,color .2s;}
header>a[href="#"]:hover{border-color:#89AACC !important;background:rgba(137,170,204,.10) !important;color:var(--accent-soft) !important;}

/* ===== 主容器 ===== */
.wrap{max-width:1060px;margin:28px auto;padding:0 20px;position:relative;z-index:1;}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;}
.bar .grow{flex:1;}

/* ===== 按钮：主按钮浅底深字，hover 反转 + 蓝光晕；次按钮透明底描边 ===== */
.btn{border:none;border-radius:999px;padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer;
  color:#0A0A0A;background:#F5F5F5;transition:all .25s;letter-spacing:.02em;}
.btn:hover{background:#141414;color:#F5F5F5;box-shadow:inset 0 0 0 1px #2A2A2E,0 0 24px rgba(137,170,204,.16);transform:translateY(-1px);}
.btn:active{transform:scale(.97);}
.btn.gold{background-image:var(--accent);color:#0B1220;box-shadow:0 0 18px rgba(137,170,204,.12);}
.btn.gold:hover{background-image:var(--accent);color:#0B1220;box-shadow:0 0 24px rgba(137,170,204,.28);transform:translateY(-1px);}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid #2A2A2E;box-shadow:none;}
.btn.ghost:hover{border-color:#89AACC;color:#89AACC;background:rgba(137,170,204,.06);box-shadow:none;transform:none;}
.btn.sm{padding:6px 14px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;}
.toggle{display:inline-flex;background:var(--surface);border:1px solid var(--stroke2);border-radius:999px;overflow:hidden;}
.toggle button{border:none;background:transparent;padding:8px 16px;font-size:13px;cursor:pointer;color:var(--muted);font-weight:600;transition:color .2s,background .2s;}
.toggle button:hover{color:var(--text);}
.toggle button.on{background-image:var(--accent);color:#0A0A0A;}
.count{font-size:12.5px;color:var(--sub);margin-left:auto;}
/* ===== 表单面板：暗色卡片 ===== */
.form{display:none;background:var(--surface);border:1px solid var(--stroke);border-radius:20px;padding:24px 26px;margin-bottom:22px;box-shadow:0 18px 44px rgba(0,0,0,.35);}
.form.open{display:block;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.fld{display:flex;flex-direction:column;}
.fld.full{grid-column:1/-1;}
.fld label{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px;letter-spacing:.04em;}
.fld label .req{color:var(--red);}
.fld input,.fld select,.fld textarea{padding:10px 12px;border:1px solid #2A2A2E;border-radius:12px;font-size:13px;font-family:inherit;background:#0A0A0A;color:var(--ink);outline:none;transition:border-color .2s,background .2s;}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--a1);background:#0E0E10;box-shadow:0 0 0 3px rgba(137,170,204,.10);}
.fld textarea{resize:vertical;}
.err{color:var(--bad);font-size:12px;margin:12px 0 0;min-height:16px;}
.mfoot{display:flex;gap:10px;margin-top:18px;}
.mfoot .btn{flex:1;}
.fld input[type="file"]{padding:8px;font-size:12px;color:var(--muted);}
.fld input[type="file"]::file-selector-button{border:none;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;color:#0A0A0A;background:#F5F5F5;margin-right:8px;transition:opacity .2s;}
.fld input[type="file"]::file-selector-button:hover{opacity:.82;}
.upp{margin-top:16px;padding-top:16px;border-top:1px dashed #2A2A2E;}
.upp-h{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:10px;letter-spacing:.04em;}
.prev{margin-top:6px;max-width:100%;max-height:84px;border-radius:8px;border:1px solid #2A2A2E;display:none;}

/* ===== 表格容器：暗色圆角面板 ===== */
.tablewrap{background:var(--surface);border:1px solid var(--stroke);border-radius:20px;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.35);}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{border-collapse:collapse;width:100%;min-width:760px;}
th,td{border-bottom:1px solid #1F1F1F;padding:10px 12px;text-align:left;vertical-align:middle;white-space:nowrap;}
th{background:var(--surface);color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;position:sticky;top:0;z-index:2;}
tbody tr{transition:background .15s;}
tbody tr:nth-child(even){background:rgba(255,255,255,.015);}
tbody tr:hover{background:rgba(137,170,204,.05);}
td.title{font-weight:600;color:var(--text);white-space:normal;min-width:140px;}
td.amt{font-family:var(--font-display);font-weight:600;font-size:14.5px;color:var(--gold);font-variant-numeric:tabular-nums;}
.cellimg{height:36px;border-radius:8px;border:1px solid #2A2A2E;vertical-align:middle;cursor:zoom-in;transition:transform .2s,box-shadow .2s;}
.cellimg:hover{transform:scale(1.12);box-shadow:0 0 18px rgba(137,170,204,.16);}
.imgs{white-space:nowrap;}
.imgs a{margin-right:3px;}
.muted{color:#5A5A60;}

/* ===== 状态徽章：成功 / 警告 / 危险 / 强调 ===== */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:3px 11px;border-radius:999px;font-weight:600;letter-spacing:.04em;border:1px solid transparent;}
.tag.wait{background:rgba(232,192,122,.08);color:#E8C07A;border-color:rgba(232,192,122,.28);}
.tag.ok{background:rgba(127,209,167,.08);color:#7FD1A7;border-color:rgba(127,209,167,.28);}
.tag.no{background:rgba(224,138,138,.08);color:#E08A8A;border-color:rgba(224,138,138,.28);}

/* ===== 行内操作 ===== */
.op{color:var(--blue);cursor:pointer;text-decoration:none;margin-right:8px;font-weight:600;font-size:12px;padding:3px 9px;border-radius:8px;border:1px solid transparent;transition:all .2s;}
.op:hover{background:rgba(137,170,204,.07);border-color:#2A2A2E;text-decoration:none;}
.op.del{color:var(--bad);}
.op.del:hover{background:rgba(224,138,138,.08);border-color:rgba(224,138,138,.28);}
.op.dis{color:#5A5A60;cursor:default;text-decoration:none;}
.op.dis:hover{background:transparent;border-color:transparent;}

.empty{text-align:center;color:#5A5A60;padding:42px;font-size:13px;}

/* ===== Toast ===== */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
  background:rgba(26,26,28,.92);backdrop-filter:blur(12px);border:1px solid #2A2A2E;color:#F5F5F5;
  padding:11px 20px;border-radius:999px;font-size:13.5px;opacity:0;transition:.3s ease;z-index:90;pointer-events:none;
  box-shadow:0 14px 36px rgba(0,0,0,.5),0 0 24px rgba(137,170,204,.10);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media(max-width:640px){.grid2{grid-template-columns:1fr;}.bar{flex-direction:column;align-items:stretch;}.toggle{align-self:center;}header{padding:12px 16px;gap:8px;}.wrap{margin:16px auto;padding:0 12px;}}

/* iOS 安全区 + 三端触控优化 */
*{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
body{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);}
button,a,.clickable{min-height:44px;}
input,select,textarea{font-size:16px !important;}
@media(max-width:480px){
  body{font-size:14px;line-height:1.6;}
  .wrap{padding:0 14px;}
  section{padding:40px 0;}
  .sec-head h2{font-size:21px;}
  .sec-head .kicker{font-size:10.5px;}
}

@media(max-width:480px){
  .grid2{grid-template-columns:1fr!important;}
  .grid.g2{grid-template-columns:1fr!important;}
  .grid.g3{grid-template-columns:1fr!important;}
  .grid.g4{grid-template-columns:1fr 1fr!important;}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .scroll table{font-size:11px;min-width:560px;}
  .scroll th,.scroll td{padding:6px 7px;}
  header{padding:10px 14px;gap:8px;flex-wrap:wrap;}
  .brand{font-size:14px;}
  .user{font-size:12px;}
  .bar{flex-direction:column;gap:8px;}
  .bar .grow{width:100%;}
  .btn{width:100%;text-align:center;}
  .fld input,.fld select,.fld textarea{font-size:16px !important;padding:10px 10px;}
  .fld label{font-size:11.5px;}
  .form{padding:16px 14px !important;}
  .modal{width:95% !important;max-width:none !important;padding:20px 16px !important;margin:10px auto !important;border-radius:14px !important;}
  .card{padding:16px !important;}
  .err{font-size:11.5px;}
  .toggle{width:100%;justify-content:center;}
  .toggle button{padding:8px 12px;font-size:12px;}
  .empty{padding:24px !important;font-size:12px;}
}
</style>
<link rel="stylesheet" href="/static/css/theme.css">
</head>
<body>
<div class="spot"></div>
<header>
  <div class="brand">星海艺术团工作端</div>
  <a href="#" onclick="history.back();return false" style="color:var(--blue);font-size:12.5px;text-decoration:none;font-weight:600;padding:4px 10px;border-radius:8px;border:1.5px solid #DDE2EC">← 返回</a><div class="crumb"><a href="/work">总览</a> / 报销申请</div>
  <div class="user">你好，<b id="uname">—</b>（<span id="urole">—</span>） <a href="/logout">登出</a></div>
</header>

<div class="wrap">
  <div class="bar">
    <button class="btn" onclick="document.getElementById('form').classList.toggle('open')">＋ 新建报销</button>
    <div class="toggle">
      <button id="tAll" class="on" onclick="setView('all')">全部</button>
      <button id="tMine" onclick="setView('mine')">我的</button>
    </div>
    <span class="count" id="count">—</span>
  </div>

  <div class="form" id="form">
    <div class="grid2">
      <div class="fld"><label>报销事项 <span class="req">*</span></label><input id="f_title" placeholder="如 合唱团演出服装采购"></div>
      <div class="fld"><label>类别 <span class="req">*</span></label>
        <select id="f_category"><option></option><option>器材采购</option><option>活动经费</option><option>差旅</option><option>培训</option><option>其他</option></select></div>
      <div class="fld"><label>金额（元） <span class="req">*</span></label><input id="f_amount" type="number" min="0" step="0.01" placeholder="如 358.50"></div>
      <div class="fld"><label>说明</label><input id="f_note" placeholder="发票/用途说明"></div>
    </div>
    <div class="upp">
      <div class="upp-h">凭证材料（发票 / 付款记录 / 到货证明 / 签收人签字，选传）</div>
      <div class="grid2">
        <div class="fld"><label>🧾 发票照片</label><input type="file" id="f_inv" accept="image/*"><img class="prev" id="p_inv"></div>
        <div class="fld"><label>💳 付款记录</label><input type="file" id="f_pay" accept="image/*"><img class="prev" id="p_pay"></div>
        <div class="fld"><label>📦 到货证明</label><input type="file" id="f_proof" accept="image/*"><img class="prev" id="p_proof"></div>
        <div class="fld"><label>✍️ 签收人签字</label><input type="file" id="f_sign" accept="image/*"><img class="prev" id="p_sign"></div>
      </div>
    </div>
    <div class="err" id="fErr"></div>
    <div class="mfoot"><button class="btn ghost" onclick="document.getElementById('form').classList.remove('open')">取消</button>
      <button class="btn" id="saveBtn" onclick="save()">提交申请</button></div>
  </div>

  <div class="tablewrap"><div class="scroll">
    <table>
      <thead><tr><th>ID</th><th>事项</th><th>类别</th><th>金额</th><th>申请人</th><th>状态</th><th>凭证</th><th>提交时间</th><th>操作</th></tr></thead>
      <tbody id="tbody"><tr><td colspan="9" class="empty">加载中…</td></tr></tbody>
    </table>
  </div></div>
</div>

<div class="toast" id="toast"></div>
<script>
let role='', view='all', uid='';
const $=id=>document.getElementById(id);
fetch('/api/me').then(r=>r.json()).then(d=>{
  if(!d.ok){location.href='/login';return;}
  $('uname').textContent=d.name;$('urole').textContent=d.role;role=d.role;uid=d.uid;load();
});
['inv','pay','proof','sign'].forEach(k=>{
  const el=$('f_'+k); if(el) el.addEventListener('change',e=>{
    const f=e.target.files[0]; const p=$('p_'+k);
    if(!f){if(p)p.style.display='none';return;}
    const rd=new FileReader(); rd.onload=ev=>{if(p){p.src=ev.target.result;p.style.display='block';}}; rd.readAsDataURL(f);
  });
});

function setView(v){view=v;$('tAll').classList.toggle('on',v==='all');$('tMine').classList.toggle('on',v==='mine');load();}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function statusTag(s){return s==='已通过'?'<span class="tag ok">已通过</span>':s==='已驳回'?'<span class="tag no">已驳回</span>':'<span class="tag wait">待审</span>';}
function amt(v){return '¥'+(+v).toFixed(2);}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

function load(){
  const p=new URLSearchParams();if(view==='mine')p.set('mine','1');
  fetch('/api/reimburse?'+p.toString()).then(r=>r.json()).then(rows=>{
    $('count').textContent='共 '+rows.length+' 条';
    const tb=$('tbody');
    if(!rows.length){tb.innerHTML='<tr><td colspan="8" class="empty">暂无报销记录</td></tr>';return;}
    tb.innerHTML=rows.map(r=>{
      const isOwner=(r.xh===uid);
      const isAppr=(role==='主席'||role==='副主席');
      const imgCell=u=>u?'<a href="'+u+'" target="_blank"><img class="cellimg" src="'+u+'"></a>':'<span class="muted">—</span>';
      const imgs=imgCell(r.inv_img)+imgCell(r.pay_img)+imgCell(r.proof_img)+imgCell(r.sign_img);
      let ops='<span class="op del" onclick="del('+r.id+')">删除</span>';
      if(isOwner||isAppr){ops+='<span class="op" onclick="dl('+r.id+')">下载Word</span>';}
      if(isAppr&&r.status==='待审'){
        ops+='<span class="op" onclick="setSt('+r.id+',\'已通过\')">通过</span>'+
             '<span class="op" onclick="setSt('+r.id+',\'已驳回\')">驳回</span>';
      } else if(!isAppr&&!isOwner){ops='<span class="op dis">—</span>';}
      return '<tr><td>'+r.id+'</td><td class="title">'+esc(r.title)+'</td><td>'+(esc(r.category)||'—')+
        '</td><td class="amt">'+amt(r.amount)+'</td><td>'+esc(r.name)+'</td><td>'+statusTag(r.status)+
        '</td><td class="imgs">'+imgs+'</td><td>'+(esc(r.created)||'—')+'</td><td>'+ops+'</td></tr>';
    }).join('');
  });
}

async function uploadOne(id){
  const f=$(id).files[0];
  if(!f) return '';
  const fd=new FormData(); fd.append('file',f);
  try{ const r=await fetch('/api/upload',{method:'POST',body:fd}); const j=await r.json(); return j.ok? j.url : ''; }
  catch(e){ return ''; }
}
async function save(){
  const d={title:$('f_title').value.trim(),category:$('f_category').value.trim(),
    amount:$('f_amount').value.trim(),note:$('f_note').value.trim()};
  if(!d.title||!d.category||!d.amount){$('fErr').textContent='请填写事项、类别与金额';return;}
  if(!['f_inv','f_pay','f_proof','f_sign'].every(i=>$(i).files[0])){
    $('fErr').textContent='请上传全部 4 张凭证图（发票/付款记录/到货证明/签收人签字）';return;
  }
  $('fErr').textContent='';const b=$('saveBtn');b.disabled=true;b.textContent='上传图片…';
  d.inv_img=await uploadOne('f_inv');
  d.pay_img=await uploadOne('f_pay');
  d.proof_img=await uploadOne('f_proof');
  d.sign_img=await uploadOne('f_sign');
  b.textContent='提交中…';
  fetch('/api/reimburse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})
    .then(r=>r.json()).then(res=>{b.disabled=false;b.textContent='提交申请';
      if(res.ok){toast('已提交，等待审批');$('form').classList.remove('open');
        ['f_title','f_category','f_amount','f_note'].forEach(i=>$(i).value='');
        ['f_inv','f_pay','f_proof','f_sign'].forEach(i=>{$(i).value='';const p=$('p_'+i.slice(2));if(p){p.src='';p.style.display='none';}});
        load();}
      else{$('fErr').textContent=res.error||'提交失败';}})
    .catch(()=>{b.disabled=false;b.textContent='提交申请';$('fErr').textContent='网络异常';});
}
function del(id){if(!confirm('确认删除该报销记录？'))return;
  fetch('/api/reimburse/'+id,{method:'DELETE'}).then(r=>r.json()).then(res=>{if(res.ok){toast('已删除');load();}else alert('删除失败');});}
function dl(id){window.open('/api/reimburse/'+id+'/export');}
function setSt(id,st){fetch('/api/reimburse/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:st})})
  .then(r=>r.json()).then(res=>{if(res.ok){toast('已'+st);load();}else alert(res.error||'操作失败');});}
</script>
</body>
</html>
