<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>资产管理 · 星海工作端</title>
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/ui.css">
<style>
  /* 页面特有：页签面板开合 + 表单开合 */
  .tabpane{display:none;}
  .tabpane.on{display:block;animation:xh-fade-in var(--xh-t-mid) var(--xh-ease);}
  .pub-form{display:none;margin-bottom:16px;}
  .pub-form.open{display:block;animation:xh-fade-in var(--xh-t-mid) var(--xh-ease);}
  .f-err{color:var(--xh-bad);font-size:12px;min-height:14px;}
  .op-dis{opacity:.35;cursor:default;}
  .xh-tablewrap table{min-width:760px;}
  td b{color:var(--xh-text);font-weight:600;}
</style>
<link rel="stylesheet" href="/static/css/bg.css">
<script src="/static/js/bg.js" defer></script>
</head>
<body>
<header class="xh-topbar">
  <a class="xh-topbar-brand" href="/work"><img src="/static/uploads/logo.png" alt="">星海<em>工作端</em></a>
  <a class="xh-btn xh-btn-ghost xh-btn-sm" href="#" onclick="history.back();return false">← 返回</a>
  <div class="xh-topbar-crumb"><a href="/work">总览</a> / 资产管理</div>
  <div class="xh-topbar-spacer"></div>
  <div class="xh-topbar-user">你好，<b id="uname">—</b><span class="xh-role" id="urole">—</span><a class="xh-btn-text" href="/logout">登出</a></div>
</header>

<main class="xh-page xh-page-wide">
  <div class="xh-page-head">
    <h1 class="xh-page-title">资产管理</h1>
    <div class="xh-page-sub">器材 / 服装 / 道具登记、借还与采购申请</div>
  </div>

  <div class="xh-toolbar">
    <div class="xh-tabs">
      <button id="tAsset" class="xh-tab on" onclick="switchTab('asset')"><i data-lucide="package"></i>资产列表</button>
      <button id="tBorrow" class="xh-tab" onclick="switchTab('borrow')"><i data-lucide="arrow-left-right"></i>借还记录</button>
      <button id="tProc" class="xh-tab" onclick="switchTab('proc')"><i data-lucide="shopping-cart"></i>采购申请</button>
    </div>
  </div>

  <!-- 资产列表 -->
  <div class="tabpane on" id="tabAsset">
    <div class="xh-toolbar">
      <button class="xh-btn xh-btn-primary" onclick="toggleForm()"><i data-lucide="plus"></i>登记资产</button>
      <select id="filtCat" class="xh-input" onchange="loadAssets()"><option value="">全部类别</option><option>器材</option><option>服装</option><option>道具</option><option>其他</option></select>
      <select id="filtSt" class="xh-input" onchange="loadAssets()"><option value="">全部状态</option><option>在库</option><option>借出</option><option>报修</option><option>报废</option></select>
      <div class="xh-toolbar-spacer"></div>
      <span class="xh-count" id="assetCount">—</span>
    </div>
    <section class="xh-panel pub-form" id="assetForm">
      <div class="xh-panel-bd">
        <div class="xh-form-grid">
          <div class="xh-field"><label>名称<span class="xh-req">*</span></label><input id="af_name" class="xh-input" placeholder="如 合唱团演出服"></div>
          <div class="xh-field"><label>类别</label><select id="af_cat" class="xh-input"><option>器材</option><option>服装</option><option>道具</option><option>其他</option></select></div>
          <div class="xh-field"><label>数量</label><input id="af_qty" class="xh-input" type="number" min="1" value="1"></div>
          <div class="xh-field"><label>存放位置</label><input id="af_loc" class="xh-input" placeholder="如 排练厅A柜"></div>
          <div class="xh-field"><label>负责人</label><input id="af_per" class="xh-input" placeholder="姓名"></div>
        </div>
        <input type="hidden" id="af_id">
        <div class="f-err" id="afErr" style="margin-top:10px"></div>
        <div class="xh-row" style="justify-content:flex-end;margin-top:10px">
          <button class="xh-btn xh-btn-ghost" onclick="toggleForm()">取消</button>
          <button class="xh-btn xh-btn-primary" id="afBtn" onclick="saveAsset()">保存</button>
        </div>
      </div>
    </section>
    <section class="xh-panel xh-panel-flush">
      <div class="xh-tablewrap"><table>
        <thead><tr><th>ID</th><th>名称</th><th>类别</th><th>数量</th><th>位置</th><th>负责人</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="assetBody"><tr><td colspan="8" class="xh-empty">加载中…</td></tr></tbody>
      </table></div>
    </section>
  </div>

  <!-- 借还记录 -->
  <div class="tabpane" id="tabBorrow">
    <div class="xh-toolbar">
      <div class="xh-toolbar-spacer"></div>
      <span class="xh-count" id="borrowCount">—</span>
    </div>
    <section class="xh-panel xh-panel-flush">
      <div class="xh-tablewrap"><table>
        <thead><tr><th>ID</th><th>资产</th><th>借用人</th><th>数量</th><th>借出日</th><th>归还日</th><th>状态</th><th>备注</th></tr></thead>
        <tbody id="borrowBody"><tr><td colspan="8" class="xh-empty">加载中…</td></tr></tbody>
      </table></div>
    </section>
  </div>

  <!-- 采购申请 -->
  <div class="tabpane" id="tabProc">
    <div class="xh-toolbar">
      <button class="xh-btn xh-btn-primary" onclick="toggleProcForm()"><i data-lucide="plus"></i>采购申请</button>
      <div class="xh-toolbar-spacer"></div>
      <span class="xh-count" id="procCount">—</span>
    </div>
    <section class="xh-panel pub-form" id="procForm">
      <div class="xh-panel-bd">
        <div class="xh-form-grid">
          <div class="xh-field"><label>物品名称<span class="xh-req">*</span></label><input id="pf_name" class="xh-input" placeholder="如 无线话筒"></div>
          <div class="xh-field"><label>类别</label><select id="pf_cat" class="xh-input"><option>器材</option><option>服装</option><option>道具</option><option>其他</option></select></div>
          <div class="xh-field"><label>数量</label><input id="pf_qty" class="xh-input" type="number" min="1" value="1"></div>
          <div class="xh-field xh-span-2"><label>申请理由</label><input id="pf_reason" class="xh-input" placeholder="为什么需要采购"></div>
        </div>
        <div class="f-err" id="pfErr" style="margin-top:10px"></div>
        <div class="xh-row" style="justify-content:flex-end;margin-top:10px">
          <button class="xh-btn xh-btn-ghost" onclick="toggleProcForm()">取消</button>
          <button class="xh-btn xh-btn-primary" id="pfBtn" onclick="saveProc()">提交申请</button>
        </div>
      </div>
    </section>
    <section class="xh-panel xh-panel-flush">
      <div class="xh-tablewrap"><table>
        <thead><tr><th>ID</th><th>物品</th><th>类别</th><th>数量</th><th>理由</th><th>申请人</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="procBody"><tr><td colspan="8" class="xh-empty">加载中…</td></tr></tbody>
      </table></div>
    </section>
  </div>
</main>

<script src="/static/js/vendor/lucide.min.js" defer></script>
<script src="/static/js/ui.js"></script>
<script>
let role='', uid='', curTab='asset';
const $=id=>document.getElementById(id);
fetch('/api/me').then(r=>r.json()).then(d=>{
  if(!d.ok){location.href='/login';return;}
  $('uname').textContent=d.name;$('urole').textContent=d.role;role=d.role;uid=d.uid;loadAssets();
});
function switchTab(t){curTab=t;$('tAsset').classList.toggle('on',t==='asset');$('tBorrow').classList.toggle('on',t==='borrow');$('tProc').classList.toggle('on',t==='proc');
  ['asset','borrow','proc'].forEach(k=>$('tab'+k.charAt(0).toUpperCase()+k.slice(1)).classList.toggle('on',k===t));
  if(t==='asset')loadAssets();if(t==='borrow')loadBorrows();if(t==='proc')loadProcs();}
function toast(m){XH.toast(m);}
function tag(s){return s==='在库'?'xh-badge ok':s==='借出'?'xh-badge warn':s==='报修'?'xh-badge bad':s==='报废'?'xh-badge neutral':s==='已归还'?'xh-badge ok':s==='通过'?'xh-badge ok':s==='驳回'?'xh-badge bad':'xh-badge warn';}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ===== 资产列表 =====
function toggleForm(){const f=$('assetForm');f.classList.toggle('open');if(!f.classList.contains('open')){$('af_id').value='';$('af_name').value='';$('af_cat').value='器材';$('af_qty').value='1';$('af_loc').value='';$('af_per').value='';$('afErr').textContent='';}}
function loadAssets(){
  const p=new URLSearchParams();const cat=$('filtCat').value,st=$('filtSt').value;if(cat)p.set('category',cat);if(st)p.set('status',st);
  fetch('/api/assets?'+p.toString()).then(r=>r.json()).then(rows=>{
    $('assetCount').textContent='共 '+rows.length+' 件';
    const tb=$('assetBody');
    if(!rows.length){tb.innerHTML='<tr><td colspan="8" class="xh-empty">暂无资产</td></tr>';return;}
    tb.innerHTML=rows.map(r=>{
      let ops='<span class="xh-btn-text" onclick="editAsset('+r.id+',\''+esc(r.name)+'\',\''+esc(r.category||'')+'\','+r.qty+',\''+esc(r.location||'')+'\',\''+esc(r.person||'')+'\')">编辑</span>';
      if(r.status==='在库')ops+='<span class="xh-btn-text" onclick="borrowAsset('+r.id+',\''+esc(r.name)+'\')">借出</span>';
      if(r.status==='借出')ops+='<span class="xh-btn-text" onclick="returnAsset('+r.id+')">归还</span>';
      if(r.status==='在库'||r.status==='借出')ops+='<span class="xh-btn-text" onclick="repairAsset('+r.id+')">报修</span>';
      if(role==='主席'||role==='副主席')ops+='<span class="xh-btn-text xh-danger-text" onclick="scrapAsset('+r.id+')">报废</span><span class="xh-btn-text xh-danger-text" onclick="delAsset('+r.id+')">删除</span>';
      return '<tr><td class="xh-num">'+r.id+'</td><td><b>'+esc(r.name)+'</b></td><td>'+esc(r.category||'—')+'</td><td class="xh-num">'+r.qty+'</td><td>'+esc(r.location||'—')+'</td><td>'+esc(r.person||'—')+'</td><td><span class="'+tag(r.status)+'">'+esc(r.status)+'</span></td><td style="white-space:nowrap">'+ops+'</td></tr>';
    }).join('');
  });
}
function editAsset(id,name,cat,qty,loc,per){$('af_id').value=id;$('af_name').value=name;$('af_cat').value=cat;$('af_qty').value=qty;$('af_loc').value=loc;$('af_per').value=per;$('assetForm').classList.add('open');}
function saveAsset(){
  const d={name:$('af_name').value.trim(),category:$('af_cat').value,qty:$('af_qty').value,location:$('af_loc').value.trim(),person:$('af_per').value.trim()};
  if(!d.name){$('afErr').textContent='请输入资产名称';return;}
  const id=$('af_id').value,url='/api/assets'+(id?'/'+id:''),m=id?'PUT':'POST';
  fetch(url,{method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(r=>r.json()).then(res=>{
    if(res.ok){toast(id?'已更新':'已登记');toggleForm();loadAssets();}else{$('afErr').textContent=res.error||'失败';}
  });
}
function delAsset(id){if(!confirm('确认删除该资产？'))return;fetch('/api/assets/'+id,{method:'DELETE'}).then(r=>r.json()).then(res=>{if(res.ok){toast('已删除');loadAssets();}else alert(res.error);});}
function borrowAsset(id,name){const q=prompt('借出数量（默认1）：','1');const d=prompt('借出日期（如 2026-09-01，留空=今天）：');if(q===null)return;
  fetch('/api/assets/'+id+'/borrow',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({qty:parseInt(q)||1,borrow_date:d,note:''})})
  .then(r=>r.json()).then(res=>{if(res.ok){toast('已借出：'+name);loadAssets();}else alert(res.error);});}
function returnAsset(id){fetch('/api/assets/'+id+'/return',{method:'POST'}).then(r=>r.json()).then(res=>{if(res.ok){toast('已归还');loadAssets();}else alert(res.error);});}
function repairAsset(id){if(!confirm('确认标记为报修？'))return;fetch('/api/assets/'+id+'/repair',{method:'POST'}).then(r=>r.json()).then(res=>{if(res.ok){toast('已报修');loadAssets();}else alert(res.error);});}
function scrapAsset(id){if(!confirm('确认报废该资产？'))return;fetch('/api/assets/'+id+'/scrap',{method:'POST'}).then(r=>r.json()).then(res=>{if(res.ok){toast('已报废');loadAssets();}else alert(res.error);});}

// ===== 借还记录 =====
function loadBorrows(){
  fetch('/api/borrows').then(r=>r.json()).then(rows=>{
    $('borrowCount').textContent='共 '+rows.length+' 条';
    const tb=$('borrowBody');
    if(!rows.length){tb.innerHTML='<tr><td colspan="8" class="xh-empty">暂无借还记录</td></tr>';return;}
    tb.innerHTML=rows.map(r=>'<tr><td class="xh-num">'+r.id+'</td><td>'+esc(r.asset_name)+'</td><td>'+esc(r.name)+'</td><td class="xh-num">'+r.qty+'</td><td class="xh-num">'+esc(r.borrow_date||'—')+'</td><td class="xh-num">'+esc(r.return_date||'—')+'</td><td><span class="'+tag(r.status)+'">'+esc(r.status)+'</span></td><td>'+esc(r.note||'—')+'</td></tr>').join('');
  });
}
// ===== 采购申请 =====
function toggleProcForm(){const f=$('procForm');f.classList.toggle('open');if(!f.classList.contains('open')){$('pf_name').value='';$('pf_qty').value='1';$('pf_reason').value='';$('pfErr').textContent='';}}
function saveProc(){
  const d={name:$('pf_name').value.trim(),category:$('pf_cat').value,qty:$('pf_qty').value,reason:$('pf_reason').value.trim()};
  if(!d.name){$('pfErr').textContent='请输入物品名称';return;}
  fetch('/api/procurements',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(r=>r.json()).then(res=>{
    if(res.ok){toast('已提交，等待审批');toggleProcForm();loadProcs();}else{$('pfErr').textContent=res.error||'失败';}
  });
}
function loadProcs(){
  fetch('/api/procurements').then(r=>r.json()).then(rows=>{
    $('procCount').textContent='共 '+rows.length+' 条';
    const tb=$('procBody');
    if(!rows.length){tb.innerHTML='<tr><td colspan="8" class="xh-empty">暂无采购申请</td></tr>';return;}
    tb.innerHTML=rows.map(r=>{
      let ops='';
      if(r.status==='待审'&&(role==='主席'||role==='副主席'))ops='<span class="xh-btn-text" onclick="approveProc('+r.id+')">通过</span><span class="xh-btn-text xh-danger-text" onclick="rejectProc('+r.id+')">驳回</span>';
      else ops='<span class="xh-btn-text op-dis">—</span>';
      return '<tr><td class="xh-num">'+r.id+'</td><td><b>'+esc(r.name)+'</b></td><td>'+esc(r.category||'—')+'</td><td class="xh-num">'+r.qty+'</td><td>'+esc(r.reason||'—')+'</td><td>'+esc(r.pname)+'</td><td><span class="'+tag(r.status)+'">'+esc(r.status)+'</span></td><td style="white-space:nowrap">'+ops+'</td></tr>';
    }).join('');
  });
}
function approveProc(id){if(!confirm('确认通过？通过后自动入库'))return;fetch('/api/procurements/'+id+'/approve',{method:'POST'}).then(r=>r.json()).then(res=>{if(res.ok){toast('已通过，自动入库');loadProcs();loadAssets();}else alert(res.error);});}
function rejectProc(id){fetch('/api/procurements/'+id+'/reject',{method:'POST'}).then(r=>r.json()).then(res=>{if(res.ok){toast('已驳回');loadProcs();}else alert(res.error);});}
</script>
</body>
</html>
