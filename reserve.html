<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>预约排期 · 星海工作端</title>
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/ui.css">
<style>
/* ===== 原版页面背景（保留，勿改动）：渐变底 + 光斑，本身即 fixed 定位 ===== */
:root{
  --iride-1:rgba(78,133,191,.10);--iride-2:rgba(137,170,204,.08);--iride-3:rgba(78,133,191,.07);--iride-4:rgba(137,170,204,.06);--iride-5:rgba(78,133,191,.09);
}
html body{
  background:radial-gradient(120% 70% at 50% -12%,#11161F 0%,#0B0C10 48%,var(--xh-bg) 100%);
  position:relative;overflow-x:hidden;
}
html body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 15% 18%,var(--iride-1),transparent 42%),
             radial-gradient(circle at 86% 46%,var(--iride-3),transparent 40%),
             radial-gradient(circle at 50% 88%,var(--iride-5),transparent 44%);}
html body::after{content:"";position:fixed;bottom:-140px;left:-100px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(78,133,191,.08) 0%,transparent 70%);
  pointer-events:none;z-index:0;}

  /* 页面特有 */
  .pub-form{display:none;margin-bottom:16px;}
  .pub-form.open{display:block;animation:xh-fade-in var(--xh-t-mid) var(--xh-ease);}
  .f-err{color:var(--xh-bad);font-size:12px;min-height:14px;}
  .op-dis{opacity:.35;cursor:default;}
  .xh-tablewrap table{min-width:820px;}
  td.item{font-weight:600;color:var(--xh-text);}
  td.tname{white-space:normal;min-width:130px;}
</style>
<link rel="stylesheet" href="/static/css/bg.css">
<script src="/static/js/bg.js" defer></script>
</head>
<body>
<header class="xh-topbar">
  <a class="xh-topbar-brand" href="/work"><img src="/static/uploads/logo.png" alt="">星海<em>工作端</em></a>
  <a class="xh-btn xh-btn-ghost xh-btn-sm" href="#" onclick="history.back();return false">← 返回</a>
  <div class="xh-topbar-crumb"><a href="/work">总览</a> / 预约排期</div>
  <div class="xh-topbar-spacer"></div>
  <div class="xh-topbar-user">你好，<b id="uname">—</b><span class="xh-role" id="urole">—</span><a class="xh-btn-text" href="/logout">登出</a></div>
</header>

<main class="xh-page">
  <div class="xh-page-head">
    <h1 class="xh-page-title">预约排期</h1>
    <div class="xh-page-sub">排练厅 / 器材 / 服装预约，主席团确认后生效</div>
  </div>

  <div class="xh-toolbar">
    <button class="xh-btn xh-btn-primary" onclick="document.getElementById('form').classList.toggle('open')"><i data-lucide="plus"></i>新建预约</button>
    <div class="xh-tabs">
      <button id="tAll" class="xh-tab on" onclick="setView('all')">全部</button>
      <button id="tMine" class="xh-tab" onclick="setView('mine')">我的</button>
    </div>
    <div class="xh-toolbar-spacer"></div>
    <span class="xh-count" id="count">—</span>
  </div>

  <section class="xh-panel pub-form" id="form">
    <div class="xh-panel-bd">
      <div class="xh-form-grid">
        <div class="xh-field">
          <label for="f_item">预约对象<span class="xh-req">*</span></label>
          <select id="f_item" class="xh-input">
            <option></option><option>排练厅</option><option>器材设备</option><option>演出服装</option><option>其他</option>
          </select>
        </div>
        <div class="xh-field">
          <label for="f_type">名称<span class="xh-req">*</span></label>
          <input id="f_type" class="xh-input" placeholder="如 101排练厅 / 三角钢琴">
        </div>
        <div class="xh-field">
          <label for="f_start">开始时间<span class="xh-req">*</span></label>
          <input id="f_start" class="xh-input" type="datetime-local">
        </div>
        <div class="xh-field">
          <label for="f_end">结束时间<span class="xh-req">*</span></label>
          <input id="f_end" class="xh-input" type="datetime-local">
        </div>
        <div class="xh-field xh-span-2">
          <label for="f_purpose">用途说明</label>
          <textarea id="f_purpose" class="xh-input" placeholder="活动 / 排练用途"></textarea>
        </div>
      </div>
      <div class="f-err" id="fErr" style="margin-top:10px"></div>
      <div class="xh-row" style="justify-content:flex-end;margin-top:10px">
        <button class="xh-btn xh-btn-ghost" onclick="document.getElementById('form').classList.remove('open')">取消</button>
        <button class="xh-btn xh-btn-primary" id="saveBtn" onclick="save()">提交预约</button>
      </div>
    </div>
  </section>

  <section class="xh-panel xh-panel-flush xh-section-gap">
    <div class="xh-tablewrap">
      <table>
        <thead><tr><th>ID</th><th>对象</th><th>名称</th><th>起</th><th>止</th><th>用途</th><th>预约人</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="9" class="xh-empty">加载中…</td></tr></tbody>
      </table>
    </div>
  </section>
</main>

<script src="/static/js/vendor/lucide.min.js" defer></script>
<script src="/static/js/ui.js"></script>
<script>
let role='', view='all', uid='';
const $=id=>document.getElementById(id);
fetch('/api/me').then(r=>r.json()).then(d=>{
  if(!d.ok){location.href='/login';return;}
  $('uname').textContent=d.name;$('urole').textContent=d.role;role=d.role;uid=d.uid;load();
});
function setView(v){view=v;$('tAll').classList.toggle('on',v==='all');$('tMine').classList.toggle('on',v==='mine');load();}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function statusTag(s){return s==='已通过'?'<span class="xh-badge ok">已通过</span>':s==='已驳回'?'<span class="xh-badge bad">已驳回</span>':'<span class="xh-badge warn">待确认</span>';}
function toast(m){XH.toast(m);}

function load(){
  const p=new URLSearchParams();if(view==='mine')p.set('mine','1');
  fetch('/api/reserve?'+p.toString()).then(r=>r.json()).then(rows=>{
    $('count').textContent='共 '+rows.length+' 条';
    const tb=$('tbody');
    if(!rows.length){tb.innerHTML='<tr><td colspan="9" class="xh-empty">暂无预约</td></tr>';return;}
    tb.innerHTML=rows.map(r=>{
      const isOwner=(r.xh===uid);
      const isAppr=(role==='主席'||role==='副主席');
      let ops='<span class="xh-btn-text xh-danger-text" onclick="del('+r.id+')">删除</span>';
      if(isAppr&&r.status==='待确认'){
        ops+='<span class="xh-btn-text" onclick="setSt('+r.id+',\'已通过\')">通过</span>'+
             '<span class="xh-btn-text" onclick="setSt('+r.id+',\'已驳回\')">驳回</span>';
      } else if(!isAppr&&!isOwner){ops='<span class="xh-btn-text op-dis">—</span>';}
      return '<tr><td class="xh-num">'+r.id+'</td><td class="item">'+esc(r.item)+'</td><td class="tname">'+esc(r.type)+
        '</td><td class="xh-num">'+(esc(r.start_time)||'—')+'</td><td class="xh-num">'+(esc(r.end_time)||'—')+
        '</td><td>'+(esc(r.purpose)||'—')+'</td><td>'+esc(r.name)+'</td><td>'+statusTag(r.status)+
        '</td><td style="white-space:nowrap">'+ops+'</td></tr>';
    }).join('');
  });
}
function save(){
  const d={item:$('f_item').value.trim(),type:$('f_type').value.trim(),
    start_time:$('f_start').value,end_time:$('f_end').value,purpose:$('f_purpose').value.trim()};
  if(!d.item||!d.type||!d.start_time||!d.end_time){$('fErr').textContent='请填写对象、名称与起止时间';return;}if(d.start_time>=d.end_time){$('fErr').textContent='结束时间必须晚于开始时间';return;}
  $('fErr').textContent='';const b=$('saveBtn');b.disabled=true;b.textContent='提交中…';
  fetch('/api/reserve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})
    .then(r=>r.json()).then(res=>{b.disabled=false;b.textContent='提交预约';
      if(res.ok){toast('已提交，等待确认');$('form').classList.remove('open');
        ['f_item','f_type','f_start','f_end','f_purpose'].forEach(i=>$(i).value='');load();}
      else{$('fErr').textContent=res.error||'提交失败';}})
    .catch(()=>{b.disabled=false;b.textContent='提交预约';$('fErr').textContent='网络异常';});
}
function del(id){if(!confirm('确认删除该预约？'))return;
  fetch('/api/reserve/'+id,{method:'DELETE'}).then(r=>r.json()).then(res=>{if(res.ok){toast('已删除');load();}else alert('删除失败');});}
function setSt(id,st){fetch('/api/reserve/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:st})})
  .then(r=>r.json()).then(res=>{if(res.ok){toast('已'+st);load();}else alert(res.error||'操作失败');});}
</script>
</body>
</html>
